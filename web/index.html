<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compass — Global Events Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f7fb;
    --bg2:#eaeef5;
    --panel:#ffffff;
    --panel2:#eef1f6;
    --line:#d8dee8;
    --line-soft:#e4e8f0;
    --text:#161c2b;
    --text-dim:#5a6478;
    --text-faint:#8a93a6;
    --amber:#b5720f;
    --amber-dim:#e7c48a;
    --cyan:#0e9488;
    --cyan-dim:#87d3c9;
    --rose:#d64545;
    --rose-dim:#eab3b3;
    --violet:#7256e0;
    --grid-dot:#dfe4ee;
    --grid-dot-active:#c3cce0;
    --radius-s:3px;
    --radius-m:6px;
    --shadow:0 12px 32px rgba(30,40,60,.10);
    --hover-line:#b7c0d1;
    --hover-bg:#eef1f6;
    --accent-hover:#0b7d72;
    --on-accent:#ffffff;
    --err-text:#9a2a2a;
    --banner-text:#5540b8;
    --sel-line:#8a96ab;
    --scroll:#c7cedb;
    --ring-track:#e2e6ee;
    --scrim:rgba(6,9,15,.6);
    /* maps */
    --map-land:#dfe5ef;
    --map-coast:#b9c3d4;
    --map-grid:#e8ecf3;
    --map-dot:#96a3be;
    --map-city:#7a8399;
    --map-label:#4a5468;
    --globe-fill:#eef1f7;
    --globe-line:#d0d7e3;
    --pin-ring:rgba(255,255,255,.92);
    --pin-empty:#aeb7c9;
    --pin-amber:#e09a2e;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0e1219; --bg2:#141923; --panel:#1a202c; --panel2:#212837;
    --line:#2d3546; --line-soft:#232a38;
    --text:#e5e9f1; --text-dim:#a2abbe; --text-faint:#6f7a90;
    --amber:#f0b45a; --amber-dim:#6e5228; --cyan:#2bbfae; --cyan-dim:#1c625b;
    --rose:#f07a7a; --rose-dim:#6e3333; --violet:#a596ff;
    --grid-dot:#252c3a; --grid-dot-active:#37415a;
    --shadow:0 14px 36px rgba(0,0,0,.45);
    --hover-line:#3e485e; --hover-bg:#222a39; --accent-hover:#35d3c1; --on-accent:#05211d;
    --err-text:#ffa3a3; --banner-text:#c2b8ff; --sel-line:#6c7891; --scroll:#343d50;
    --ring-track:#2a3242; --scrim:rgba(0,0,0,.6);
    --map-land:#253046; --map-coast:#36435e; --map-grid:#19202c; --map-dot:#5d6b88;
    --map-city:#6c7892; --map-label:#9ba6bc; --globe-fill:#121823; --globe-line:#2a3242;
    --pin-ring:rgba(14,18,25,.95); --pin-empty:#4a5468; --pin-amber:#f0b45a;
    color-scheme:dark;
  } }
  :root[data-theme="dark"]{
    --bg:#0e1219; --bg2:#141923; --panel:#1a202c; --panel2:#212837;
    --line:#2d3546; --line-soft:#232a38;
    --text:#e5e9f1; --text-dim:#a2abbe; --text-faint:#6f7a90;
    --amber:#f0b45a; --amber-dim:#6e5228; --cyan:#2bbfae; --cyan-dim:#1c625b;
    --rose:#f07a7a; --rose-dim:#6e3333; --violet:#a596ff;
    --grid-dot:#252c3a; --grid-dot-active:#37415a;
    --shadow:0 14px 36px rgba(0,0,0,.45);
    --hover-line:#3e485e; --hover-bg:#222a39; --accent-hover:#35d3c1; --on-accent:#05211d;
    --err-text:#ffa3a3; --banner-text:#c2b8ff; --sel-line:#6c7891; --scroll:#343d50;
    --ring-track:#2a3242; --scrim:rgba(0,0,0,.6);
    --map-land:#253046; --map-coast:#36435e; --map-grid:#19202c; --map-dot:#5d6b88;
    --map-city:#6c7892; --map-label:#9ba6bc; --globe-fill:#121823; --globe-line:#2a3242;
    --pin-ring:rgba(14,18,25,.95); --pin-empty:#4a5468; --pin-amber:#f0b45a;
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(79,209,197,.07), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(255,180,84,.06), transparent 60%);
    pointer-events:none; z-index:0;
  }
  h1,h2,h3,h4,.disp{font-family:'Space Grotesk',sans-serif; letter-spacing:-.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit}
  button{font-family:inherit; cursor:pointer;}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px}
  ::selection{background:rgba(14,148,136,.18)}

  /* ---------- shell layout ---------- */
  #app{display:flex; min-height:100%; position:relative; z-index:1;}
  #boot{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:var(--bg); z-index:500;
  }
  #boot .mark{font-size:34px;}
  #boot .lbl{color:var(--text-dim); font-size:13px;}
  .spin{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--cyan);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  #logingate{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); z-index:500; padding:20px;
  }
  .lg-card{
    width:min(360px,100%); text-align:center; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-m); padding:30px 28px; box-shadow:var(--shadow);
  }
  .lg-name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;}
  .lg-desc{font-size:12.5px; color:var(--text-dim); margin-top:12px; line-height:1.5;}
  .lg-footnote{font-size:10.5px; color:var(--text-faint); margin-top:16px;}

  nav.rail{
    width:216px; flex:0 0 auto; background:var(--bg2); border-right:1px solid var(--line-soft);
    display:flex; flex-direction:column; padding:18px 12px; gap:2px;
    position:sticky; top:0; height:100vh; height:100dvh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 20px 8px;}
  .brand .glyph{
    width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),var(--violet));
    display:flex;align-items:center;justify-content:center;font-weight:700;color:#0a0e17;font-family:'Space Grotesk',sans-serif;font-size:15px;flex:none;
  }
  .brand .name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;}
  .brand .sub{font-size:10.5px;color:var(--text-faint);margin-top:1px;}
  .navitem{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-m);
    color:var(--text-dim); font-size:13.5px; font-weight:500; border:1px solid transparent; background:none;
    text-align:left; width:100%;
  }
  .navitem svg{width:16px;height:16px;flex:none;opacity:.85}
  .navitem:hover{background:var(--panel); color:var(--text);}
  .navitem.active{background:var(--panel); color:var(--text); border-color:var(--line);}
  .navitem.active svg{color:var(--cyan); opacity:1}
  .nav-section{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); padding:16px 10px 6px;}
  .rail-foot{margin-top:auto; padding-top:12px; border-top:1px solid var(--line-soft);}
  .whoami{display:flex; align-items:center; gap:9px; padding:8px 8px;}
  .avatar{
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:#0a0e17;flex:none;font-family:'Space Grotesk',sans-serif;
  }
  .whoami .nm{font-size:12.5px;font-weight:600;}
  .whoami .rl{font-size:10.5px;color:var(--text-faint);}
  .acctlinks{display:flex; align-items:center; gap:6px; padding:0 8px 6px 45px; font-size:11.5px; color:var(--text-faint);}
  .acctlinks button{background:none; border:0; padding:2px 0; color:var(--text-dim); font:inherit; cursor:pointer;}
  .acctlinks button:hover{color:var(--text); text-decoration:underline; text-underline-offset:2px;}
  .acctstatus{font-size:11px; color:var(--text-faint); margin-top:1px;}
  .acctstatus .off{color:var(--rose); font-weight:600;}
  .linkbox{display:flex; gap:8px;}
  .linkbox input{flex:1; min-width:0; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px;}
  .rolepill{font-size:9.5px; padding:1px 6px; border-radius:20px; font-weight:600; letter-spacing:.02em; display:inline-block; margin-top:2px;}
  .rolepill.admin{background:rgba(255,180,84,.15); color:var(--amber);}
  .rolepill.manager{background:rgba(79,209,197,.15); color:var(--cyan);}
  .rolepill.attendee{background:rgba(157,140,255,.15); color:var(--violet);}
  .previewlabel{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); padding:0 8px; margin-bottom:5px;}
  .previewbanner{font-size:10.5px; color:var(--amber); background:rgba(224,154,46,.1); border:1px solid rgba(224,154,46,.3); border-radius:6px; padding:6px 8px; margin:0 8px 8px;}
  .previewbanner.impersonate{color:var(--violet); background:rgba(114,86,224,.1); border-color:rgba(114,86,224,.3);}
  .previewbanner button{background:none;border:none;color:var(--cyan);font-weight:700;font-size:10.5px;text-decoration:underline;padding:0;cursor:pointer;}
  #previewswitch .rolebtns{padding:0 8px 10px;}

  main{flex:1; min-width:0; padding:22px 30px 60px; max-width:1440px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .pagetitle{font-size:22px; font-weight:700;}
  .pagesub{color:var(--text-dim); font-size:13px; margin-top:2px;}
  .search{
    display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-m); padding:8px 12px; min-width:230px; color:var(--text-dim); font-size:13px;
  }
  .search input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;font-family:inherit;}

  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--radius-m);
    border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:13px; font-weight:600;
    transition:border-color .15s, background .15s;
  }
  .btn:hover{border-color:var(--hover-line); background:var(--hover-bg);}
  .btn.primary{background:var(--cyan); color:var(--on-accent); border-color:var(--cyan);}
  .btn.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover);}
  .btn.ghost{background:none;}
  .btn.danger{color:var(--rose); border-color:var(--rose-dim);}
  .btn.sm{padding:5px 10px; font-size:12px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .iconbtn{width:30px;height:30px;border-radius:var(--radius-m);border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .iconbtn:hover{color:var(--text); border-color:var(--hover-line);}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-m);}
  .panel-pad{padding:18px 20px;}

  /* KPI row */
  .kpis{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:20px;}
  .kpi{padding:15px 16px; border-radius:var(--radius-m); border:1px solid var(--line); background:var(--panel);}
  .kpi .v{font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700; line-height:1;}
  .kpi .l{font-size:11.5px; color:var(--text-dim); margin-top:6px;}
  .kpi .t{font-size:10.5px; margin-top:8px; font-weight:600;}
  .kpi .t.up{color:var(--cyan)} .kpi .t.warn{color:var(--amber)} .kpi .t.bad{color:var(--rose)}

  .dashgrid{display:grid; grid-template-columns:1.55fr 1fr; gap:16px; align-items:start;}
  .mapwrap{position:relative; overflow:hidden; border-radius:var(--radius-m);}
  .maphead{display:flex; align-items:center; justify-content:space-between; padding:14px 18px 0;}
  .maphead h3{font-size:14px; font-weight:700; margin:0;}
  .maptoggle{display:flex; gap:4px; background:var(--bg2); border:1px solid var(--line); border-radius:20px; padding:3px;}
  .maptoggle button{border:none;background:none;color:var(--text-dim);font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:16px;}
  .maptoggle button.active{background:var(--panel); color:var(--text); box-shadow:0 0 0 1px var(--line);}
  .mapzoom{display:flex; align-items:center; gap:2px;}
  .mapzoom button{width:24px;height:24px;border:1px solid var(--line);background:var(--panel);color:var(--text-dim);font-size:13px;font-weight:700;border-radius:5px;display:flex;align-items:center;justify-content:center;}
  .mapzoom button:hover{color:var(--text); border-color:var(--hover-line);}
  .mapzoom .reset{width:auto; padding:0 8px; font-size:10.5px; font-weight:600;}
  .maptools{display:flex; align-items:center; gap:10px;}
  canvas#worldcanvas{display:block; width:100%; height:390px; cursor:grab;}
  canvas#staffcanvas{display:block; width:100%; height:300px; cursor:grab;}
  .maplegend{position:absolute; left:18px; bottom:14px; display:flex; gap:14px; font-size:10.5px; color:#e8edf7; background:rgba(10,14,23,.6); padding:6px 10px; border-radius:20px; backdrop-filter:blur(4px);}
  .dot-leg{display:inline-flex; align-items:center; gap:5px;}
  .dot-leg i{width:7px;height:7px;border-radius:50%;display:inline-block;}

  .sidecol{display:flex; flex-direction:column; gap:14px;}
  .upnext-row{display:flex; align-items:center; gap:11px; padding:10px 8px; border-radius:var(--radius-m);}
  .upnext-row:hover{background:var(--bg2);}
  .datebadge{width:42px;height:42px;flex:none;border-radius:8px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .datebadge .mo{font-size:9px;color:var(--amber);font-weight:700;letter-spacing:.03em;}
  .datebadge .da{font-size:15px;font-weight:700;font-family:'Space Grotesk',sans-serif;line-height:1;}
  .un-name{font-size:12.5px;font-weight:600; overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px;}
  .un-meta{font-size:11px;color:var(--text-faint);}

  /* Events list */
  .filterbar{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  select, .selfake{
    background:var(--panel); border:1px solid var(--line); color:var(--text); font-size:12.5px; font-weight:500;
    padding:7px 10px; border-radius:var(--radius-m); outline:none; font-family:inherit;
  }
  table.events{width:100%; border-collapse:collapse; font-size:13px;}
  table.events th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:600; padding:0 12px 10px; border-bottom:1px solid var(--line);}
  table.events td{padding:12px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  table.events tbody tr{cursor:pointer;}
  table.events tbody tr:hover{background:var(--bg2);}
  .statusdot{width:8px;height:8px;border-radius:50%;display:inline-block; margin-right:7px;}
  .st-confirmed{background:var(--cyan)} .st-investigating{background:var(--amber)} .st-waitlist{background:var(--violet)}
  .st-completed{background:var(--text-faint)} .st-not-attending{background:var(--rose)} .st-planning{background:#4a86e8}
  .evname{font-weight:600;}
  .evloc{color:var(--text-dim); font-size:12px;}
  .progwrap{display:flex; align-items:center; gap:8px; width:110px;}
  .progtrack{flex:1;height:5px;border-radius:4px;background:var(--line-soft);overflow:hidden;}
  .progfill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));}
  .progpct{font-size:11px;color:var(--text-dim); width:30px; text-align:right;}
  .stackav{display:flex;}
  .stackav .mini{width:20px;height:20px;border-radius:50%;border:2px solid var(--panel);margin-left:-7px;font-size:8.5px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#12151f;}
  .stackav .mini:first-child{margin-left:0;}
  .badge{font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:20px; display:inline-block;}
  .badge.pri-high{background:rgba(255,107,107,.15); color:var(--rose);}
  .badge.pri-critical{background:var(--rose); color:#ffffff;}
  .badge.pri-medium{background:rgba(255,180,84,.15); color:var(--amber);}
  .badge.pri-low{background:rgba(147,162,191,.15); color:var(--text-dim);}
  .emptynote{text-align:center; padding:60px 20px; color:var(--text-dim);}

  /* Drawer */
  #drawerbg{position:fixed; inset:0; background:var(--scrim); backdrop-filter:blur(2px); z-index:200; display:none;}
  #drawer{
    position:fixed; top:0; right:0; height:100%; width:min(680px,94vw); background:var(--bg2); z-index:201;
    box-shadow:-20px 0 60px rgba(0,0,0,.5); transform:translateX(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column; border-left:1px solid var(--line-soft);
    padding-top:env(safe-area-inset-top,0px);
  }
  #drawer.open{transform:translateX(0);}
  #drawerbg.open{display:block;}
  .dh{padding:20px 24px 0;}
  .dh-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .dh-title{font-size:19px; font-weight:700; font-family:'Space Grotesk',sans-serif; max-width:440px;}
  .dh-loc{color:var(--text-dim); font-size:12.5px; margin-top:5px; display:flex; align-items:center; gap:6px;}
  .dtabs{display:flex; gap:2px; margin-top:18px; border-bottom:1px solid var(--line);}
  .dtab{padding:9px 4px; margin-right:20px; font-size:12.5px; font-weight:600; color:var(--text-faint); border-bottom:2px solid transparent; background:none; border-top:none;border-left:none;border-right:none;}
  .dtab.active{color:var(--text); border-bottom-color:var(--cyan);}
  .dbody{flex:1; overflow-y:auto; padding:20px 24px 40px;}
  .dsection{display:none;}
  .dsection.active{display:block;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; color:var(--text-faint); margin-bottom:5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text); padding:8px 10px;
    border-radius:var(--radius-m); font-size:13px; font-family:inherit; outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--cyan);}
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  .costtotal{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-m); margin:16px 0;}
  .costtotal .v{font-size:22px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
  .impactcard{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px;}
  .impactstat{padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--panel);}
  .impactstat .v{font-size:17px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
  .impactstat .l{font-size:10.5px; color:var(--text-faint); margin-top:3px;}

  .limitbar{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-m); margin-bottom:14px;}
  .limitbar .count{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;}
  .limitbar.over{border-color:var(--rose-dim); background:rgba(255,107,107,.06);}
  .dropzone{
    min-height:76px; border:1.5px dashed var(--line); border-radius:var(--radius-m); padding:10px;
    display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; background:rgba(255,255,255,.015);
  }
  .dropzone.over{border-color:var(--cyan); background:rgba(79,209,197,.06);}
  .dropzone.blocked{border-color:var(--rose); background:rgba(255,107,107,.06);}
  .chip{
    display:flex; align-items:center; gap:7px; background:var(--bg2); border:1px solid var(--line);
    padding:6px 10px 6px 6px; border-radius:20px; font-size:12px; font-weight:600; cursor:grab;
  }
  .chip .x{color:var(--text-faint); font-size:13px; margin-left:2px;}
  .chip .x:hover{color:var(--rose);}
  .poolgrid{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .subhead{font-size:12px; font-weight:700; color:var(--text-dim); margin:18px 0 8px; text-transform:uppercase; letter-spacing:.05em;}
  .checkitem{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13px;}
  .checkitem .ck{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line); flex:none; display:flex;align-items:center;justify-content:center;}
  .checkitem.done .ck{background:var(--cyan); border-color:var(--cyan); color:var(--on-accent);}
  .checkitem.done .lbl{color:var(--text-dim); text-decoration:line-through;}
  .ringwrap{display:flex; align-items:center; gap:18px; padding:6px 0 18px;}
  .ring{position:relative; width:92px;height:92px;flex:none;}
  .ring svg{transform:rotate(-90deg);}
  .ring .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:700; font-family:'Space Grotesk',sans-serif;}

  .collateral-item, .roster-src{
    display:flex; align-items:center; gap:8px; background:var(--bg2); border:1px solid var(--line);
    padding:7px 11px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:grab;
  }
  .collateral-item.req{border-color:var(--amber-dim);}
  .collateral-item .tag{font-size:9px; color:var(--amber); font-weight:700;}

  /* ---------- staffing / inventory quick-assign pages ---------- */
  .assigngrid{display:grid; grid-template-columns:280px 1fr; gap:16px; align-items:start; margin-top:16px;}
  @media (max-width:980px){ .assigngrid{grid-template-columns:1fr;} }
  .sourcelist{display:flex; flex-direction:column; gap:8px; max-height:640px; overflow-y:auto; padding-right:4px;}
  .srcchip{
    display:flex; align-items:center; gap:9px; background:var(--bg2); border:1px solid var(--line);
    padding:9px 11px; border-radius:var(--radius-m); font-size:12.5px; font-weight:600; cursor:grab;
  }
  .srcchip:active{cursor:grabbing;}
  .srcchip.dragging{opacity:.4;}
  .srcchip.picked{border-color:var(--cyan); box-shadow:0 0 0 2px var(--cyan-dim);}
  .srcchip:focus-visible, .chip:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}
  body.picking .droprow{border-color:var(--cyan-dim); cursor:copy;}
  body.picking .droprow:hover{border-color:var(--cyan); background:rgba(14,148,136,.07);}
  .srcchip .meta{min-width:0; flex:1;}
  .srcchip .meta .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .srcchip .meta .ct{font-size:10.5px; color:var(--text-faint); font-weight:500;}
  .srcchip .icn{font-size:16px; flex:none; width:22px; text-align:center;}
  .srcchip.req{border-color:var(--amber-dim);}
  .droprows{display:flex; flex-direction:column; gap:6px;}
  .droprow{
    display:flex; align-items:center; gap:12px; padding:10px 12px; border:1.5px dashed var(--line);
    border-radius:var(--radius-m); background:var(--panel); transition:border-color .12s, background .12s;
  }
  .droprow.over{border-color:var(--cyan); background:rgba(14,148,136,.07);}
  .droprow.blocked{border-color:var(--rose); background:rgba(214,69,69,.08);}
  .droprow .dr-date{width:42px;flex:none;text-align:center;}
  .droprow .dr-date .mo{font-size:9px;color:var(--amber);font-weight:700;letter-spacing:.03em;}
  .droprow .dr-date .da{font-size:15px;font-weight:700;font-family:'Space Grotesk',sans-serif;line-height:1;}
  .droprow .dr-info{min-width:0; flex:0 0 210px;}
  .droprow .dr-info .nm{font-weight:600; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .droprow .dr-info .lc{font-size:11px; color:var(--text-faint);}
  .droprow .dr-chips{flex:1; display:flex; flex-wrap:wrap; gap:6px; min-height:24px;}
  .droprow .dr-empty{font-size:11px; color:var(--text-faint); font-style:italic;}
  .minichip{
    display:flex; align-items:center; gap:5px; background:var(--panel); border:1px solid var(--line);
    padding:3px 8px 3px 3px; border-radius:16px; font-size:11px; font-weight:600;
  }
  .minichip.collat{padding:4px 9px;}
  .minichip .x{color:var(--text-faint); font-size:11px; cursor:pointer;}
  .minichip .x:hover{color:var(--rose);}
  .assignhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;}
  .assignhint{font-size:11.5px; color:var(--text-faint);}
  .staffmapwrap{margin-bottom:18px;}

  .toast-wrap{position:fixed; bottom:20px; right:24px; z-index:400; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--panel); border:1px solid var(--line); padding:11px 16px; border-radius:var(--radius-m); font-size:13px; box-shadow:var(--shadow); display:flex; align-items:center; gap:9px; animation:toastin .2s ease;}
  .toast.err{border-color:var(--rose-dim); color:var(--err-text);}
  .toast.ok{border-color:var(--cyan-dim);}
  @keyframes toastin{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}

  .cardgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
  .rostercard{padding:14px; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--panel); display:flex; gap:11px; align-items:center;}
  .rostercard .info .nm{font-weight:700; font-size:13px;}
  .rostercard .info .ti{font-size:11.5px; color:var(--text-dim);}

  .modalbg{position:fixed; inset:0; background:rgba(6,9,15,.65); z-index:300; display:none; align-items:center; justify-content:center; padding:20px;}
  .modalbg.open{display:flex;}
  .modal{background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius-m); width:min(460px,100%); padding:22px; box-shadow:var(--shadow);}
  .modal.wide{width:min(640px,100%);}
  .modal h3{margin:0 0 14px; font-size:16px;}

  .rolerow{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line-soft);}
  .rolebtns{display:flex; gap:5px;}
  .rolebtns button{font-size:11px; padding:4px 9px; border-radius:20px; border:1px solid var(--line); background:none; color:var(--text-dim); font-weight:600;}
  .rolebtns button.sel{background:var(--panel); color:var(--text); border-color:var(--sel-line);}

  .banner{display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:var(--radius-m); background:rgba(114,86,224,.08); border:1px solid rgba(114,86,224,.28); color:var(--banner-text); font-size:12.5px; margin-bottom:18px;}
  .discoverform{display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:10px; align-items:end; margin-bottom:20px;}
  .suggestcard{padding:14px 16px; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--panel); margin-bottom:10px;}
  .suggestcard h4{margin:0 0 4px; font-size:13.5px;}
  .suggestcard .meta{font-size:11.5px; color:var(--text-dim); margin-bottom:8px;}
  .suggestcard .why{font-size:12px; color:var(--text-dim); margin-bottom:10px; line-height:1.5;}

  .empty-state{text-align:center; padding:70px 20px; color:var(--text-dim);}
  .empty-state .ic{font-size:32px; margin-bottom:10px;}

  /* Project Map */
  .pmcard{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px 18px; margin-bottom:12px;}
  .pmhead{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  .pmname{font-weight:700; font-size:14.5px;}
  .pmmeta{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .pmsteps{display:flex; align-items:center;}
  .pmstep{display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; position:relative; cursor:pointer; background:none; border:none; font-family:inherit;}
  .pmstep .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line); display:flex;align-items:center;justify-content:center; font-size:14px; background:var(--panel2); color:var(--text-faint); transition:all .15s;}
  .pmstep.done .dot{background:var(--cyan); border-color:var(--cyan); color:var(--on-accent);}
  .pmstep .lbl{font-size:10.5px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.03em;}
  .pmstep .dt{font-size:10px; color:var(--text-faint);}
  .pmstep::after{content:""; position:absolute; top:15px; left:calc(50% + 15px); width:calc(100% - 30px); height:2px; background:var(--line); z-index:0;}
  .pmstep:last-child::after{display:none;}
  .pmstep.done::after{background:var(--cyan);}
  .pmbadge{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .pmbadge.complete{background:rgba(14,148,136,.15); color:var(--cyan);}
  .pmbadge.pending{background:rgba(224,154,46,.15); color:var(--amber);}

  /* Feedback */
  .fbcard{border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:10px; background:var(--panel);}
  .fbhead{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .fbauthor{font-weight:700; font-size:13px;}
  .fbdate{font-size:11px; color:var(--text-faint);}
  .fbfield{margin-bottom:8px;}
  .fbfield .k{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); margin-bottom:2px;}
  .fbfield .v{font-size:12.5px; color:var(--text-dim); white-space:pre-wrap;}
  .fbphotos{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .fbphotos img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}

  /* Travel */
  .travelcard{border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:10px; background:var(--panel);}
  .travelhead{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .travelhead .nm{font-weight:700; font-size:13px;}
  .travelsection{display:flex; align-items:center; gap:18px; margin-bottom:8px; flex-wrap:wrap;}
  .travelchk{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); white-space:nowrap;}
  .checkinbtn.done{background:rgba(14,148,136,.12); color:var(--cyan); border-color:var(--cyan-dim);}
  .travelsummary{font-size:10.5px; color:var(--text-faint);}

  /* bulk import */
  .filepick{border:1.5px dashed var(--line); border-radius:var(--radius-m); padding:16px; text-align:center; font-size:12.5px; color:var(--text-dim); cursor:pointer; background:var(--panel2);}
  .filepick:hover{border-color:var(--cyan);}
  .filepick input[type=file]{display:none;}
  .ortext{text-align:center; font-size:11px; color:var(--text-faint); margin:12px 0; text-transform:uppercase; letter-spacing:.06em;}
  .importtable{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px;}
  .importtable th{text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); padding:0 8px 6px; border-bottom:1px solid var(--line);}
  .importtable td{padding:6px 8px; border-bottom:1px solid var(--line-soft);}
  .importtable tr.rowerr td{color:var(--rose);}
  .importsummary{display:flex; gap:14px; font-size:12px; margin:10px 0; color:var(--text-dim);}
  .importsummary b{color:var(--text);}
  .importscroll{max-height:260px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--radius-m);}

  @media (max-width:980px){
    nav.rail{position:fixed; z-index:250; transform:translateX(-100%); transition:transform .2s;}
    nav.rail.open{transform:translateX(0);}
    main{padding:16px;}
    .kpis{grid-template-columns:repeat(2,1fr);}
    .dashgrid{grid-template-columns:1fr;}
    .row2,.row3,.impactcard{grid-template-columns:1fr 1fr;}
    #drawer{width:100vw;}
  }
  .hamb{display:none;}
  #navtoggle{position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:12px; z-index:260; width:36px; height:36px; font-size:17px; box-shadow:var(--shadow);}
  #railbg{display:none;}
  @media (max-width:980px){
    .hamb{display:flex;}
    main{padding-top:58px;}
    #railbg.open{display:block; position:fixed; inset:0; background:rgba(6,9,15,.35); z-index:240;}
  }
  .wide-x{overflow-x:auto;}
</style>
</head>

function normalizeKey(s){ return String(s||'').toLowerCase().trim().replace(/\s+/g,' '); }
/* Scan free text for a known city name (longest match wins) and return its coordinates, or null */
function matchCityInText(text){
  const t = normalizeKey(text);
  if(!t) return null;
  let best=null, bestLen=0;
  for(const key in CITY_COORDS){
    const k=key.trim(); if(!k) continue;
    if(k.length<=bestLen) continue;
    const re=new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
    if(re.test(t)){ best=CITY_COORDS[key]; bestLen=k.length; }
  }
  return best;
}

/* Parse a free-text "City, Region" or "City, Country" home location into [lat,lon] with a stable jitter */
function geocodeHome(raw){
  if(!raw) return null;
  const parts = String(raw).split(',').map(s=>s.trim()).filter(Boolean);
  if(parts.length===0) return null;
  const cityHit = matchCityInText(parts[0]) || matchCityInText(raw);
  if(cityHit){
    const h=hashStr(raw);
    const dx=(((h%1000)+1000)%1000/1000-0.5)*0.4;
    const dy=((((h>>10)%1000)+1000)%1000/1000-0.5)*0.4;
    return [cityHit[0]+dx, cityHit[1]+dy];
  }
  const last = parts[parts.length-1].toLowerCase();
  let base = HOME_REGION_COORDS[last] || STATE_COORDS[last] || COUNTRY_COORDS[last];
  if(!base){
    const whole = parts.join(', ').toLowerCase();
    base = STATE_COORDS[whole] || COUNTRY_COORDS[whole];
  }
  if(!base) return null;
  const h=hashStr(raw);
  const dx=(((h%1000)+1000)%1000/1000-0.5)*2.5;
  const dy=((((h>>10)%1000)+1000)%1000/1000-0.5)*2.5;
  return [base[0]+dx, base[1]+dy];

/* ---------------- shared flat-map zoom/pan helpers ---------------- */
function projFlat(lon,lat,W,H,view){
  return [ ((lon+180)/360*W)*view.zoom + view.panX, ((90-lat)/180*H)*view.zoom + view.panY ];
}
function clampPan(view,W,H){
  const maxOffX = W*(view.zoom-1) + W*0.3;
  const maxOffY = H*(view.zoom-1) + H*0.3;
  view.panX = Math.max(-maxOffX, Math.min(maxOffX, view.panX));
  view.panY = Math.max(-maxOffY, Math.min(maxOffY, view.panY));
}
function zoomAt(view,W,H,mx,my,factor){
  const newZoom = Math.max(1, Math.min(8, view.zoom*factor));
  if(newZoom===view.zoom) return;
  const wx=(mx-view.panX)/view.zoom, wy=(my-view.panY)/view.zoom;
  view.zoom=newZoom;
  view.panX = mx - wx*view.zoom;
  view.panY = my - wy*view.zoom;
  clampPan(view,W,H);
}
function wireMapZoomPan(canvas, view, onChange, opts){
  opts = opts||{};
  canvas.addEventListener('wheel', (ev)=>{
    if(opts.isActive && !opts.isActive()) return;
    ev.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const mx=ev.clientX-rect.left, my=ev.clientY-rect.top;
    zoomAt(view, canvas._w, canvas._h, mx, my, ev.deltaY<0?1.15:1/1.15);
    onChange();
  }, {passive:false});
  let dragging=false, lastX=0, lastY=0;
  canvas.addEventListener('mousedown',(ev)=>{
    if(opts.isActive && !opts.isActive()) return;
    dragging=true; lastX=ev.clientX; lastY=ev.clientY; canvas.style.cursor='grabbing';
  });
  window.addEventListener('mousemove',(ev)=>{
    if(!dragging) return;
    if(opts.isActive && !opts.isActive()){ dragging=false; return; }
    view.panX += (ev.clientX-lastX); view.panY += (ev.clientY-lastY);
    lastX=ev.clientX; lastY=ev.clientY;
    clampPan(view, canvas._w, canvas._h);
    onChange();
  });
  window.addEventListener('mouseup',()=>{ dragging=false; if(canvas && (!opts.isActive || opts.isActive())) canvas.style.cursor='grab'; });
}

function landRings(){
  if(LAND_RINGS) return LAND_RINGS;
  const t=LAND_TOPO, sx=t.transform.scale[0], sy=t.transform.scale[1], tx=t.transform.translate[0], ty=t.transform.translate[1];
  const arcs=t.arcs.map(arc=>{ let x=0,y=0; return arc.map(d=>{ x+=d[0]; y+=d[1]; return [x*sx+tx, y*sy+ty]; }); });
  const ring=(ids)=>{ const pts=[]; ids.forEach(id=>{ let a=id<0?arcs[~id].slice().reverse():arcs[id]; if(pts.length) a=a.slice(1); for(const q of a) pts.push(q); }); return pts; };
  LAND_RINGS=[];
  t.objects.land.geometries.forEach(g=>{
    const polys = g.type==='Polygon' ? [g.arcs] : g.arcs;
    polys.forEach(poly=>poly.forEach(ids=>{
      const pts=ring(ids);
      // Unwrap longitudes so rings crossing the 180° line stay continuous (no streaks across the map)
      for(let i=1;i<pts.length;i++){ let d=pts[i][0]-pts[i-1][0]; if(d>180) pts[i]=[pts[i][0]-360,pts[i][1]]; else if(d<-180) pts[i]=[pts[i][0]+360,pts[i][1]]; }
      let minX=1e9,maxX=-1e9,minY=90,maxY=-90;
      pts.forEach(([x,y])=>{ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; });
      if(maxY<-60) return; // leave Antarctica off — no events there, and it swamps the bottom of the map

  const addRing=(pts,shift)=>{ pts.forEach(([lon,lat],i)=>{ const x=lon+shift+180, y=90-lat; if(i===0) LAND_PATH.moveTo(x,y); else LAND_PATH.lineTo(x,y); }); LAND_PATH.closePath(); };
  landRings().forEach(r=>{
    addRing(r.pts,0);

    const pts=r.pts, lonT=L;

let LAND_DOTS=null;
function buildLandDots(){
  if(LAND_DOTS) return LAND_DOTS;
  LAND_DOTS=[];
  for(let lat=-58;lat<=82;lat+=2.2){
    for(let lon=-179;lon<=179;lon+=2.2){

function drawLandFlat(ctx,W,H,view){
  ctx.save();

  ctx.beginPath();
  for(let lon=-150;lon<=150;lon+=30){ const [x]=projFlat(lon,0,W,H,view); ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for(let lat=-60;lat<=60;lat+=30){ const [,y]=projFlat(0,lat,W,H,view); ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();

/* Draw labeled reference points for major cities once zoomed in enough to be legible */
function drawCityLabels(ctx,W,H,view){
  if(view.zoom<1.6) return;
  const lonAt=(sx)=> (sx-view.panX)/view.zoom/W*360-180;
  const latAt=(sy)=> 90-(sy-view.panY)/view.zoom/H*180;
  const lonMin=Math.min(lonAt(0),lonAt(W)), lonMax=Math.max(lonAt(0),lonAt(W));
  const latMin=Math.min(latAt(0),latAt(H)), latMax=Math.max(latAt(0),latAt(H));
  ctx.font='9px Inter, sans-serif';
  ctx.textBaseline='middle';
  const cityDot=tok('--map-city'), cityTxt=tok('--map-label');
  for(const name in CITY_COORDS){
    const [lat,lon]=CITY_COORDS[name];
    if(lon<lonMin||lon>lonMax||lat<latMin||lat>latMax) continue;
    const [x,y]=projFlat(lon,lat,W,H,view);
    ctx.beginPath(); ctx.arc(x,y,1.6,0,7); ctx.fillStyle=cityDot; ctx.fill();
    ctx.fillStyle=cityTxt; ctx.textAlign='left';

/* ---------------- progress + cost/impact math ---------------- */
function computeCost(ev){
  const c=ev.cost||{};
  const staff = (c.staffOverride!=null && c.staffOverride!=='') ? Number(c.staffOverride) : (ev.attendees||[]).length * 950;
  const tc=ev.travelCosts||{};
  const perTravelerIds=Object.keys(tc).filter(pid=>(ev.attendees||[]).includes(pid));
  const hasPerTraveler=perTravelerIds.length>0;
  const travel = hasPerTraveler ? perTravelerIds.reduce((s,pid)=>s+(Number(tc[pid].travel)||0),0) : (Number(c.travel)||0);
  const lodging = hasPerTraveler ? perTravelerIds.reduce((s,pid)=>s+(Number(tc[pid].lodging)||0),0) : (Number(c.lodging)||0);
  const total = (Number(c.booth)||0)+travel+lodging+(Number(c.shipping)||0)+(Number(c.misc)||0)+staff;
  return {staff, total, travel, lodging, hasPerTraveler};
}
function computeImpact(ev){
  const audience = Number(ev.audience)||0;
  const expectedLeads = (ev.impact&&ev.impact.expectedLeads!=null&&ev.impact.expectedLeads!=='') ? Number(ev.impact.expectedLeads) : Math.round(audience*0.004);
  const {total}=computeCost(ev);
  const costPerLead = expectedLeads>0 ? Math.round(total/expectedLeads) : null;
  const priIdx = Math.max(0, PRIORITIES.indexOf((ev.impact&&ev.impact.priority)||"Medium"));
  const scaleAudience = Math.min(1, Math.log10(audience+10)/5);
  const scaleCostEff = total>0 ? Math.min(1, (expectedLeads*150)/total) : 0.5;
  const scalePriority = (priIdx+1)/4;
  const score = Math.round((scaleAudience*3.5 + scaleCostEff*3.5 + scalePriority*3)*1);
  return {expectedLeads, costPerLead, impactScore: Math.max(1,Math.min(10,score))};
}
function computeProgress(ev){
  const {total}=computeCost(ev);
  const hasCost = total>0;
  const hasTeam = (ev.attendees||[]).length>0;
  const required = COLLATERAL_LIB.filter(c=>c.required);
  const packedItems = packedItemIds(ev);
  const requiredPacked = required.length===0 ? true : required.every(c=>packedItems.has(c.id));
  const confirmed = (ev.status||'').toLowerCase().includes('confirm');
  const hasReg = !!(ev.website);
  let pct = (hasCost?20:0)+(hasTeam?25:0)+(requiredPacked?25:0)+(confirmed?15:0)+(hasReg?15:0);
  return {pct, hasCost, hasTeam, requiredPacked, confirmed, hasReg};
}

/* ---------------- permission helpers ---------------- */
function can(action){
  // Impersonating (viewing as a specific other person) is always strictly read-only —
  // no write action is ever allowed while looking through someone else's eyes.
  if(IMPERSONATING) return false;
  if(MY_ROLE==='admin') return true;
  // Managers have full privilege except: they cannot edit roster/employee info (name, title,
  // email, home location) and cannot assign roles (the Permissions page stays admin-only).
  if(MY_ROLE==='manager') return ['edit_event','assign_team','assign_collateral','manage_collateral_lib','create_event','self_attend','edit_milestones'].includes(action);
  return ['self_attend','view'].includes(action);
}

const MILESTONE_DEFS=[
  {key:'paid', label:'Paid', icon:'💳'},
  {key:'staffed', label:'Staffed', icon:'👥'},
  {key:'resourced', label:'Resourced', icon:'📦'},
  {key:'travelPlanned', label:'Travel Planned', icon:'🧳', auto:true},
  {key:'checkedIn', label:'Checked In', icon:'📍', auto:true},
  {key:'attended', label:'Attended', icon:'✅', auto:true},
];

/* Travel Planned / Checked In / Attended are never set by hand — they're derived straight from
   each traveler's own hotel/flight booked checkboxes and check-in, so "Attended" can only ever
   become true once every assigned traveler has actually checked in. */
function computeAutoMilestones(e){
  const assigned=e.attendees||[];
  if(assigned.length===0) return {travelPlanned:null, checkedIn:null, attended:null};
  let allBooked=true, allCheckedIn=true, maxCheckin=null;
  assigned.forEach(pid=>{
    const t=getTravel(e,pid);
    if(!(t.hotelConfirmed && t.flightConfirmed)) allBooked=false;
    if(!t.checkedIn) allCheckedIn=false;
    else if(t.checkedInAt && (!maxCheckin || t.checkedInAt>maxCheckin)) maxCheckin=t.checkedInAt;
  });
  const eventStarted = e.start ? parseDay(e.start) <= new Date() : true;
  return {
    travelPlanned: allBooked ? true : null,
    checkedIn: allCheckedIn ? (maxCheckin||true) : null,
    attended: (allCheckedIn && eventStarted) ? (maxCheckin||true) : null,
  };
}
function getMilestones(e){ return Object.assign({}, e.milestones||{}, computeAutoMilestones(e)); }
function milestoneDateLabel(val){ if(!val) return '—'; return val===true ? 'Complete' : fmtDateShort(val); }
async function setMilestone(eventId, key, value){
  if(!EVENTS.find(x=>x.id===eventId)) return;
  await mutateEvent(eventId, ev=>{ const cur=Object.assign({}, ev.milestones||{}); if(value) cur[key]=value; else delete cur[key]; return {milestones:cur}; });
  const def=MILESTONE_DEFS.find(d=>d.key===key);
  logActivity('milestone', `${value?'Marked':'Unmarked'} "${def?def.label:key}"${value&&value!==true?' ('+value+')':''}`, eventId);
}

/* ============================================================
   COLLATERAL DATA MODEL — multi-location inventory
   An event's `collateral` array holds entries encoded as "itemId::locationId"
   (or a bare itemId for legacy data saved before locations existed, which is
   treated as belonging to that item's sole/legacy stock location).
   ============================================================ */
function encodeCollateralEntry(itemId, locId){ return locId ? (itemId+'::'+locId) : itemId; }
function decodeCollateralEntry(str){
  const idx=String(str||'').indexOf('::');
  if(idx===-1) return {itemId:str, locId:null};
  return {itemId:str.slice(0,idx), locId:str.slice(idx+2)};
}
/* Returns this item's stock locations as [{id,location,quantity}], synthesizing one from
   legacy single quantity/location fields (id "legacy") if it predates multi-location stock. */
function getStockLocations(item){
  if(Array.isArray(item.stockLocations) && item.stockLocations.length) return item.stockLocations;
  if(item.quantity!=null || item.location) return [{id:'legacy', location:item.location||'', quantity:item.quantity}];
  return [];
}
/* All itemIds packed for an event, regardless of which stock location they came from */
function packedItemIds(ev){
  const s=new Set();
  (ev.collateral||[]).forEach(entry=>s.add(decodeCollateralEntry(entry).itemId));
  return s;
}
/* Availability for one item. Pass locId to scope to a single stock location; omit for the
   item's aggregate across all its stock locations. */
function collateralAvailability(item, locId){
  const locs=getStockLocations(item);
  const matches=(entry)=>{
    const d=decodeCollateralEntry(entry);
    if(d.itemId!==item.id) return false;
    if(locId==null) return true;
    if(d.locId===locId) return true;
    if(d.locId===null && locs.length===1 && locs[0].id===locId) return true; // legacy bare-id entries
    return false;
  };
  const used = EVENTS.reduce((n,e)=> n + (e.collateral||[]).filter(matches).length, 0);
  let total=null;
  if(locId!=null){
    const loc=locs.find(l=>l.id===locId);
    total = loc && loc.quantity!=null ? Number(loc.quantity) : null;
  } else if(locs.length){
    total = locs.every(l=>l.quantity!=null) ? locs.reduce((s,l)=>s+Number(l.quantity||0),0) : null;
  }
  const hasLimit = total!=null;
  const available = hasLimit ? Math.max(0,total-used) : null;
  return {used, total, hasLimit, available};
}

async function loadAll(){
  if(!claudeDb){ EVENTS=[]; ROSTER=[]; COLLATERAL_LIB=[]; ROLES={}; FEEDBACK=[]; ACTIVITY=[]; MEMBERS={}; return; }
  try{
    const [ev, ro, cl, rl, fb, al, mb] = await Promise.all([
      claudeDb.collection('events').get().catch(()=>({docs:[]})),
      claudeDb.collection('roster').get().catch(()=>({docs:[]})),
      claudeDb.collection('collateralLibrary').get().catch(()=>({docs:[]})),
      claudeDb.collection('roles').get().catch(()=>({docs:[]})),
      claudeDb.collection('feedback').get().catch(()=>({docs:[]})),
      claudeDb.collection('activityLog').get().catch(()=>({docs:[]})),
      claudeDb.collection('members').get().catch(()=>({docs:[]})),
    ]);
    EVENTS = (ev.docs||ev||[]).map(d=>normalizeDoc(d)).filter(Boolean);
    ROSTER = (ro.docs||ro||[]).map(d=>normalizeDoc(d)).filter(Boolean);
    COLLATERAL_LIB = (cl.docs||cl||[]).map(d=>normalizeDoc(d)).filter(Boolean);
    const roleDocs = (rl.docs||rl||[]).map(d=>normalizeDoc(d)).filter(Boolean);
    ROLES={}; roleDocs.forEach(r=>ROLES[r.id]=r);
    FEEDBACK = (fb.docs||fb||[]).map(d=>normalizeDoc(d)).filter(Boolean);
    ACTIVITY = (al.docs||al||[]).map(d=>normalizeDoc(d)).filter(Boolean);
    MEMBERS={}; (mb.docs||mb||[]).map(d=>normalizeDoc(d)).filter(Boolean).forEach(m=>MEMBERS[m.id]=m);
  }catch(e){ console.warn('loadAll error', e); }
}
/* Lightweight audit trail — fire-and-forget, never blocks the action it's logging */
async function logActivity(action, detail, eventId){
  const entry={
    id: uid('log'), ts: Date.now(), actorId: ME_ID, actorName: ME_PROFILE.name||'Teammate',
    action, detail: detail||'', eventId: eventId||null, eventName: eventId?((EVENTS.find(x=>x.id===eventId)||{}).name||''):'',
  };
  ACTIVITY.unshift(entry);
  if(ACTIVITY.length>500) ACTIVITY.length=500;
  if(claudeDb){ try{ await claudeDb.collection('activityLog').doc(entry.id).set(entry); }catch(e){} }
}
function normalizeDoc(snap){
  // db query results are DocumentSnapshot: {id, exists, data()}
  if(!snap) return null;
  if(typeof snap.data === 'function'){
    if(snap.exists===false) return null;
    return Object.assign({id:snap.id}, snap.data()||{});
  }
  if(snap.id) return snap;
  return snap;
}

function stripId(o){ const c=Object.assign({},o||{}); delete c.id; return c; }
async function ensureMyRole(){
  if(!ME_ID) return;
  // Register myself (self-writable) so Admins can see and promote me on the Permissions page
  const prev=MEMBERS[ME_ID]||{};
  const member=Object.assign(stripId(prev), {name:ME_PROFILE.name||prev.name||'', joinedAt:prev.joinedAt||Date.now(), lastSeen:Date.now()});
  MEMBERS[ME_ID]=Object.assign({id:ME_ID}, member);
  if(claudeDb){ try{ await claudeDb.collection('members').doc(ME_ID).set(member); }catch(e){ console.warn('could not register member', e); } }
  // The artifact owner always has admin rights, no matter what's stored — this is the safety
  // net so testing/demoting your own role (e.g. via Permissions, or a stray "preview as") can
  // never permanently lock the owner out of their own app.
  if(IS_OWNER){
    MY_ROLE='admin'; ACTUAL_ROLE='admin';
    if(!ROLES[ME_ID] || ROLES[ME_ID].role!=='admin'){
      ROLES[ME_ID]={id:ME_ID, role:'admin', name:ME_PROFILE.name||''};
      if(claudeDb){ try{ await claudeDb.collection('roles').doc(ME_ID).set({role:'admin', name:ME_PROFILE.name||'', claimedAt:Date.now()}); }catch(e){} }
    }
    return;
  }
  // No role doc = Attendee. New people never write their own role (they couldn't make themselves Admin if they tried).
  const existing = ROLES[ME_ID];
  MY_ROLE = (existing && existing.role) || 'attendee'; ACTUAL_ROLE=MY_ROLE;
}
/* Keep the shared activity log from growing forever: an Admin's session prunes the oldest entries past 500 */
async function trimActivityLog(){
  if(ACTUAL_ROLE!=='admin' || !claudeDb || ACTIVITY.length<=500) return;
  const oldest=ACTIVITY.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).slice(0, Math.min(100, ACTIVITY.length-500));
  for(const a of oldest){ try{ await claudeDb.collection('activityLog').doc(a.id).delete(); }catch(e){ return; } }
  const gone=new Set(oldest.map(a=>a.id)); ACTIVITY=ACTIVITY.filter(a=>!gone.has(a.id));
}
/* ---------------- live updates: see teammates' changes without reloading ---------------- */
const LIVE_COLLECTIONS=['events','roster','collateralLibrary','roles','feedback','activityLog','members'];
let LIVE_TIMER=null;
function applyCollection(name, rows){
  if(name==='events') EVENTS=rows;
  else if(name==='roster') ROSTER=rows;
  else if(name==='collateralLibrary') COLLATERAL_LIB=rows;
  else if(name==='roles'){ ROLES={}; rows.forEach(r=>ROLES[r.id]=r); if(!IS_OWNER && !IMPERSONATING){ const r=(ROLES[ME_ID]&&ROLES[ME_ID].role)||'attendee'; if(r!==ACTUAL_ROLE){ const previewing=MY_ROLE!==ACTUAL_ROLE; ACTUAL_ROLE=r; if(!previewing) MY_ROLE=r; renderShell(); } } }
  else if(name==='feedback') FEEDBACK=rows;
  else if(name==='activityLog') ACTIVITY=rows;
  else if(name==='members'){ MEMBERS={}; rows.forEach(m=>MEMBERS[m.id]=m); }
}
function userIsBusy(){
  const a=document.activeElement;
  const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !a.closest('.search') && a.id!=='staffsearch' && a.id!=='invsearch';
  return typing || document.getElementById('modalbg').classList.contains('open') || !!PICK;
}
function scheduleLiveRefresh(){ clearTimeout(LIVE_TIMER); LIVE_TIMER=setTimeout(applyLiveRefresh, 400); }
function applyLiveRefresh(){
  if(document.getElementById('app').style.display==='none') return;
  if(userIsBusy()){ LIVE_TIMER=setTimeout(applyLiveRefresh, 2000); return; }   // never yank a form out from under someone
  const y=window.scrollY, dScroll=(document.getElementById('dbody')||{}).scrollTop||0;
  const drawerOpen=document.getElementById('drawer').classList.contains('open');
  setView(currentView);
  if(drawerOpen){ if(getEv()){ renderDrawer(); const b=document.getElementById('dbody'); if(b) b.scrollTop=dScroll; } else closeDrawer(); }
  window.scrollTo(0,y);
}
function startLiveUpdates(){
  if(!claudeDb) return;
  let subscribed=0;
  LIVE_COLLECTIONS.forEach(name=>{
    const col=claudeDb.collection(name);
    if(typeof col.onSnapshot!=='function') return;
    try{
      let last=null;
      col.onSnapshot(snap=>{
        const rows=((snap&&snap.docs)||snap||[]).map(d=>normalizeDoc(d)).filter(Boolean);
        const sig=JSON.stringify(rows);
        if(last===null){ last=sig; return; }      // first snapshot = what we already loaded
        if(sig===last) return; last=sig;
        applyCollection(name, rows); scheduleLiveRefresh();
      }, err=>console.warn('live updates stopped for '+name, err));
      subscribed++;
    }catch(e){ console.warn(e); }
  });
  if(subscribed) return;
  // No live subscriptions available (standalone server build): check for changes every 15 seconds
  let last=JSON.stringify([EVENTS,ROSTER,COLLATERAL_LIB,ROLES,FEEDBACK,MEMBERS]);
  setInterval(async ()=>{
    if(document.hidden) return;
    await loadAll();
    if(!IS_OWNER){ const r=(ROLES[ME_ID]&&ROLES[ME_ID].role)||'attendee'; if(r!==ACTUAL_ROLE && !IMPERSONATING){ const previewing=MY_ROLE!==ACTUAL_ROLE; ACTUAL_ROLE=r; if(!previewing) MY_ROLE=r; renderShell(); } }
    const sig=JSON.stringify([EVENTS,ROSTER,COLLATERAL_LIB,ROLES,FEEDBACK,MEMBERS]);
    if(sig!==last){ last=sig; scheduleLiveRefresh(); }
  }, 15000);
}

let worldCanvas, worldCtx, worldPins=[];
function dashZoomBtn(factor){
  if(!worldCanvas) return;
  const W=worldCanvas._w, H=worldCanvas._h;
  if(mapMode==='flat') zoomAt(flatView,W,H,W/2,H/2,factor);
  else globeZoom=Math.max(0.6,Math.min(2.5, globeZoom*factor));
  drawWorld();
}
function dashZoomReset(){
  if(mapMode==='flat') flatView={zoom:1,panX:0,panY:0};
  else globeZoom=1;
  drawWorld();
}
function initWorldCanvas(){
  worldCanvas=document.getElementById('worldcanvas');
  if(!worldCanvas) return;
  const dpr=window.devicePixelRatio||1;
  const rect=worldCanvas.getBoundingClientRect();
  worldCanvas.width=rect.width*dpr; worldCanvas.height=390*dpr;
  worldCtx=worldCanvas.getContext('2d');
  worldCtx.scale(dpr,dpr);
  worldCanvas._w=rect.width; worldCanvas._h=390;
  drawWorld();
  worldCanvas.onclick=(ev)=>{
    const rect2=worldCanvas.getBoundingClientRect();
    const mx=ev.clientX-rect2.left, my=ev.clientY-rect2.top;
    let best=null, bestD=18;
    worldPins.forEach(p=>{ const d=Math.hypot(p.x-mx,p.y-my); if(d<bestD){bestD=d; best=p;} });
    if(best) openEventDrawer(best.id);
  };
  let dragStartX=0;
  worldCanvas.onmousedown=(e)=>{ mapDragging=true; dragStartX=e.clientX; worldCanvas.style.cursor='grabbing'; };
  window.addEventListener('mouseup',()=>{ mapDragging=false; if(worldCanvas) worldCanvas.style.cursor='grab'; });
  window.addEventListener('mousemove',(e)=>{
    if(mapDragging && mapMode==='globe'){ globeRot += (e.clientX-dragStartX)*0.005; dragStartX=e.clientX; drawWorld(); }
  });
  worldCanvas.addEventListener('wheel',(ev)=>{
    if(mapMode!=='globe') return;
    ev.preventDefault();
    globeZoom=Math.max(0.6,Math.min(2.5, globeZoom*(ev.deltaY<0?1.12:1/1.12)));
    drawWorld();
  }, {passive:false});
  wireMapZoomPan(worldCanvas, flatView, drawWorld, {isActive:()=>mapMode==='flat'});
}
function redrawMapsForTheme(){ if(worldCtx && document.getElementById('worldcanvas')) drawWorld(); if(staffCtx && document.getElementById('staffcanvas')) drawStaffMap(); }
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawMapsForTheme); }catch(e){}
new MutationObserver(redrawMapsForTheme).observe(document.documentElement,{attributes:true, attributeFilter:['data-theme']});
function startGlobe(){ if(globeAnim) return; globeAnim=setInterval(()=>{ if(!mapDragging){ globeRot+=0.0035; drawWorld(); } }, 30); }
function stopGlobe(){ if(globeAnim){ clearInterval(globeAnim); globeAnim=null; } }

function drawWorld(){
  if(!worldCtx) return;
  const W=worldCanvas._w, H=worldCanvas._h;
  worldCtx.clearRect(0,0,W,H);
  worldPins=[];

  if(mapMode==='flat'){
    drawLandFlat(worldCtx,W,H,flatView);
    drawCityLabels(worldCtx,W,H,flatView);
    EVENTS.forEach(e=>{
      const geo=geocode(e); if(!geo) return;
      const [lat,lon]=geo;
      const [x,y]=projFlat(lon,lat,W,H,flatView);
      drawPin(x,y,e);
    });
  } else {
    const dots=buildLandDots();
    const cx=W/2, cy=H/2, R=(Math.min(W,H)/2 - 14)*globeZoom;
    worldCtx.beginPath(); worldCtx.arc(cx,cy,R,0,7);
    worldCtx.fillStyle=tok('--globe-fill'); worldCtx.fill();
    worldCtx.strokeStyle=tok('--globe-line'); worldCtx.lineWidth=1; worldCtx.stroke();
    const dotCol=tok('--map-dot');
    dots.forEach(([lon,lat])=>{
      const φ=lat*Math.PI/180, λ=lon*Math.PI/180 - globeRot;
      const cosc=Math.cos(φ)*Math.cos(λ);
      if(cosc<0.02) return;
      const x=cx+R*Math.cos(φ)*Math.sin(λ);
      const y=cy-R*Math.sin(φ);
      const depth=Math.max(.35,cosc);
      worldCtx.fillStyle=dotCol; worldCtx.globalAlpha=depth;
      worldCtx.beginPath(); worldCtx.arc(x,y,1.3,0,7); worldCtx.fill(); worldCtx.globalAlpha=1;
    });
    EVENTS.forEach(e=>{
      const geo=geocode(e); if(!geo) return;
      const [lat,lon]=geo;
      const φ=lat*Math.PI/180, λ=lon*Math.PI/180 - globeRot;
      const cosc=Math.cos(φ)*Math.cos(λ);
      if(cosc<0.05) return;
      const x=cx+R*Math.cos(φ)*Math.sin(λ);
      const y=cy-R*Math.sin(φ);
      drawPin(x,y,e);
    });
  }
}
function pinColor(e){
  const s=(e.status||'').toLowerCase();
  if(s.includes('confirm')) return tok('--cyan');
  if(s.includes('invest')) return tok('--pin-amber');
  if(s.includes('wait')) return tok('--violet');
  return tok('--text-faint');
}
function drawPin(x,y,e){
  const n=(e.attendees||[]).length;
  const r=4+Math.min(4,n*0.8);
  worldCtx.beginPath(); worldCtx.arc(x,y,r,0,7);
  worldCtx.fillStyle=pinColor(e); worldCtx.globalAlpha=.92; worldCtx.fill(); worldCtx.globalAlpha=1;
  worldCtx.lineWidth=1.3; worldCtx.strokeStyle=tok('--pin-ring'); worldCtx.stroke();
  worldPins.push({x,y,id:e.id});
}

function buildProjectMapCard(e, canEdit){
  const m=getMilestones(e);
  const doneCount=MILESTONE_DEFS.filter(d=>m[d.key]).length;
  const ts=travelSummary(e);
  const card=document.createElement('div'); card.className='pmcard';
  card.innerHTML=`
    <div class="pmhead">
      <div style="cursor:pointer;" class="pm-open">
        <div class="pmname">${esc(e.name)}</div>
        <div class="pmmeta">${fmtDateShort(e.start)}${e.end&&e.end!==e.start?' – '+fmtDateShort(e.end):''} · ${esc(e.location||e.country||'')}</div>
      </div>
      <span class="pmbadge ${doneCount===MILESTONE_DEFS.length?'complete':'pending'}">${doneCount} of ${MILESTONE_DEFS.length} complete</span>
    </div>
    ${ts.total?`<div class="travelsummary" style="margin:-6px 0 10px;">🏨 ${ts.hotel}/${ts.total} hotel booked · ✈️ ${ts.flight}/${ts.total} flight booked · 🟢 ${ts.checkedIn}/${ts.total} checked in</div>`:''}
    <div class="pmsteps"></div>
  `;
  card.querySelector('.pm-open').addEventListener('click',()=>openEventDrawer(e.id));
  const stepsWrap=card.querySelector('.pmsteps');
  MILESTONE_DEFS.forEach(def=>{
    const val=m[def.key];
    const step=document.createElement(def.auto?'div':'button'); step.className='pmstep'+(val?' done':'');
    step.innerHTML=`<div class="dot">${val?'✓':def.icon}</div><div class="lbl">${def.label}${def.auto?' <span style="opacity:.55;">(auto)</span>':''}</div><div class="dt">${milestoneDateLabel(val)}</div>`;
    if(def.auto){
      step.style.cursor='default';
      step.title='Tracked automatically from each traveler\u2019s Travel tab — not set by hand.';
    } else if(canEdit){
      step.addEventListener('click', async ()=>{
        if(!val){
          await setMilestone(e.id, def.key, todayISO());
        } else {
          const input=await askInput(`${def.label} date`, 'Date (YYYY-MM-DD) — clear the field to unmark', val===true?'':val);
          if(input===null) return;
          const trimmed=input.trim();
          if(trimmed==='') await setMilestone(e.id, def.key, null);
          else if(/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) await setMilestone(e.id, def.key, trimmed);
          else { toast('Use YYYY-MM-DD format','err'); return; }
        }
        renderProjectMap();
      });
    } else {
      step.style.cursor='default';
    }
    stepsWrap.appendChild(step);
  });
  return card;
}
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ============================================================
   CONFLICTS — same person double-booked on overlapping-date events
   ============================================================ */
function computeConflicts(){
  const conflicts=[];
  const byPerson={};
  EVENTS.forEach(e=>{
    if(!e.start) return;
    const s=parseDay(e.start).getTime(); const en=e.end? parseDay(e.end).getTime() : s;
    (e.attendees||[]).forEach(pid=>{ (byPerson[pid]=byPerson[pid]||[]).push({e, s, en}); });
  });
  Object.keys(byPerson).forEach(pid=>{
    const list=byPerson[pid].sort((a,b)=>a.s-b.s);
    for(let i=0;i<list.length-1;i++){
      for(let j=i+1;j<list.length;j++){
        if(list[j].s<=list[i].en){
          const person=ROSTER.find(r=>r.id===pid);
          conflicts.push({personId:pid, personName:person?person.name:'Someone', a:list[i].e, b:list[j].e});
        }
      }
    }
  });
  return conflicts;
}

/* ============================================================
   BUDGET — spend rollups by business unit, quarter and year
   ============================================================ */
function renderBudget(){
  const main=document.getElementById('main');
  const byBU={}, byQuarter={}, byYear={};
  let totalAll=0;
  EVENTS.forEach(e=>{
    const {total}=computeCost(e);
    totalAll+=total;
    const bu=e.business||'Unassigned';
    byBU[bu]=(byBU[bu]||0)+total;
    const year = e.start? parseDay(e.start).getFullYear() : (e.year||'Unknown');
    byYear[year]=(byYear[year]||0)+total;
    if(e.start){
      const d=parseDay(e.start); const qn=Math.floor(d.getMonth()/3)+1; const key=d.getFullYear()*10+qn;
      if(!byQuarter[key]) byQuarter[key]={label:'Q'+qn+' '+d.getFullYear(), amt:0};
      byQuarter[key].amt+=total;
    }
  });
  const buRows=Object.entries(byBU).sort((a,b)=>b[1]-a[1]);
  const qRows=Object.entries(byQuarter).sort((a,b)=>Number(a[0])-Number(b[0])).map(([k,v])=>[v.label,v.amt]);
  const yRows=Object.entries(byYear).sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
  const maxBU=Math.max(1,...buRows.map(r=>r[1]));
  const maxQ=Math.max(1,...qRows.map(r=>r[1]));
  const maxY=Math.max(1,...yRows.map(r=>r[1]));

function exportEventsCsv(){

function csvCell(v){

function renderAnalytics(){

/* Read-modify-write on the LATEST copy of an event, so two people editing the same event at once
   don't overwrite each other's team / packing / travel changes (the old code wrote back a stale array). */
async function mutateEvent(id, fn){
  let fresh=null;
  if(claudeDb){ try{ fresh=normalizeDoc(await claudeDb.collection('events').doc(id).get()); }catch(e){} }
  const idx=EVENTS.findIndex(e=>e.id===id);
  if(!fresh) fresh = idx>=0 ? EVENTS[idx] : null;
  if(!fresh) return null;
  const patch=fn(fresh);
  const merged=Object.assign({}, fresh, patch||{}, {id});
  if(idx>=0) EVENTS[idx]=merged; else EVENTS.push(merged);
  if(!patch) return null;
  if(claudeDb){
    try{ await claudeDb.collection('events').doc(id).update(patch); }
    catch(e){ console.warn(e); toast(e&&e.message&&/only|can't|cannot/i.test(e.message)?e.message:'Couldn\u2019t save that change. Check your connection and try again.','err'); }
  }
  return patch;
}
async function eventAddAttendee(id,pid){
  let full=false;
  await mutateEvent(id, ev=>{ const cur=ev.attendees||[]; if(cur.includes(pid)) return null; if(cur.length>=(ev.maxAttendees||6)){ full=true; return null; } return {attendees:[...cur,pid]}; });
  return full?'full':'ok';
}
function eventRemoveAttendee(id,pid){ return mutateEvent(id, ev=>{ const cur=ev.attendees||[]; return cur.includes(pid)?{attendees:cur.filter(x=>x!==pid)}:null; }); }
function eventAddCollateral(id,key){ return mutateEvent(id, ev=>{ const cur=ev.collateral||[]; return cur.includes(key)?null:{collateral:[...cur,key]}; }); }
function eventRemoveCollateral(id,key){ return mutateEvent(id, ev=>{ const cur=ev.collateral||[]; return cur.includes(key)?{collateral:cur.filter(x=>x!==key)}:null; }); }
async function saveEventById(id, patch){
  const idx=EVENTS.findIndex(e=>e.id===id);
  if(idx<0) return;
  EVENTS[idx]=Object.assign({}, EVENTS[idx], patch);
  if(claudeDb){ try{ await claudeDb.collection('events').doc(id).update(patch); }catch(e){ console.warn(e); } }
}

  else if(drawerTab==='travel') renderTabTravel(body,e);
  else if(drawerTab==='feedback') renderTabFeedback(body,e);
  else renderTabProgress(body,e);
}

function copyCalendarEvent(e){
  const fmt=(d)=>{ const dt=new Date(d); return dt.getUTCFullYear()+String(dt.getUTCMonth()+1).padStart(2,'0')+String(dt.getUTCDate()).padStart(2,'0'); };
  const start=e.start?fmt(e.start):fmt(Date.now());
  const end=e.end?fmt(new Date(new Date(e.end).getTime()+86400000)):start;
  const ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT',
    'SUMMARY:'+String(e.name||'Event').replace(/\n/g,' '),
    'DTSTART;VALUE=DATE:'+start, 'DTEND;VALUE=DATE:'+end,
    'LOCATION:'+String(e.location||e.country||'').replace(/\n/g,' '),
    'DESCRIPTION:'+String(e.notes||'').replace(/\n/g,'\\n'),
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ics).then(
      ()=>toast('Calendar event copied — paste into a .ics file or your calendar app\u2019s import','ok'),
      ()=>toast('Could not copy — your browser blocked clipboard access','err')
    );
  } else {
    toast('Clipboard access isn\u2019t available in this view','err');
  }
}

function renderTabTeam(body,e){
  const max=e.maxAttendees||6;
  const assigned=e.attendees||[];
  const over=assigned.length>max;
  const canManage=can('assign_team');
  const canSelf=can('self_attend');
  const myPid=myRosterId();
  const iAmIn = myPid && assigned.includes(myPid);
  body.innerHTML=`
    <div class="limitbar ${over?'over':''}">
      <div><span class="count">${assigned.length}</span> / <span class="count" style="color:var(--text-dim);">${max}</span> assigned</div>
      ${canManage?`<div style="display:flex;align-items:center;gap:8px;"><label style="font-size:11.5px;color:var(--text-faint);">Limit</label><input id="maxin" type="number" value="${max}" style="width:60px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--text);"></div>`:''}
    </div>
    <div class="subhead">Assigned team</div>
    <div class="dropzone" id="assignedzone"></div>
    ${canSelf?`<button class="btn sm" id="selfbtn" style="margin-top:10px;">${iAmIn?'Remove myself':'Add myself'}</button>`:''}
    <div class="subhead">Available roster</div>
    ${canManage?'<div class="assignhint" style="margin:-4px 0 6px;">Tap someone to add them, or drag them into the team above.</div>':''}
    <div class="poolgrid" id="poolzone"></div>
  `;
  const assignedZone=document.getElementById('assignedzone');
  const poolZone=document.getElementById('poolzone');
  assigned.forEach(pid=>{
    const person=ROSTER.find(r=>r.id===pid) || {id:pid, name:profileName(pid)};
    assignedZone.appendChild(makeAvatarChip(person, canManage, true));
  });
  ROSTER.filter(r=>!assigned.includes(r.id)).forEach(person=>{
    poolZone.appendChild(makeAvatarChip(person, canManage, false));
  });
  if(canManage){
    [assignedZone].forEach(zone=>{
      zone.addEventListener('dragover',(ev)=>{ ev.preventDefault(); zone.classList.add('over'); });
      zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
      zone.addEventListener('drop',async (ev)=>{
        ev.preventDefault(); zone.classList.remove('over');
        const pid=ev.dataTransfer.getData('text/plain');
        if(!pid) return;
        if((getEv().attendees||[]).includes(pid)) return;
        const res=await eventAddAttendee(drawerEventId,pid);
        if(res==='full'){ toast('Attendee limit reached for this event','err'); zone.classList.add('blocked'); setTimeout(()=>zone.classList.remove('blocked'),500); renderDrawer(); return; }
        renderDrawer(); renderEventRows();
      });
    });
    poolZone.addEventListener('dragover',(ev)=>ev.preventDefault());
    poolZone.addEventListener('drop',async (ev)=>{
      ev.preventDefault();
      const pid=ev.dataTransfer.getData('text/plain');
      if((getEv().attendees||[]).includes(pid)){ await eventRemoveAttendee(drawerEventId,pid); renderDrawer(); renderEventRows(); }
    });
  }
  const maxin=document.getElementById('maxin');
  if(maxin) maxin.addEventListener('change', async ()=>{ await saveEv({maxAttendees:Number(maxin.value)||1}); renderDrawer(); });
  const selfbtn=document.getElementById('selfbtn');
  if(selfbtn) selfbtn.addEventListener('click', async ()=>{
    if(!myPid){ toast('Could not find your roster profile — try reloading','err'); return; }
    if(iAmIn){ await eventRemoveAttendee(drawerEventId,myPid); }
    else{
      const res=await eventAddAttendee(drawerEventId,myPid);
      if(res==='full'){ toast('This event is at its attendee limit','err'); renderDrawer(); return; }
    }
    renderDrawer(); renderEventRows();
  });
}
function makeAvatarChip(person, draggable, removable){
  const chip=document.createElement('div'); chip.className='chip';
  chip.draggable=!!draggable;
  chip.innerHTML=`<span class="avatar" style="width:20px;height:20px;font-size:9px;background:${colorFor(person.id)}">${initialsFor(person.name)}</span>${esc(person.name)}${removable&&draggable?'<span class="x" data-rm="'+person.id+'">✕</span>':''}`;
  if(draggable) chip.addEventListener('dragstart',(ev)=>ev.dataTransfer.setData('text/plain', person.id));
  // Tap/click to add — drag-and-drop doesn't work on phones and tablets
  if(draggable && !removable){
    chip.style.cursor='pointer'; chip.title='Tap to add to this event';
    chip.addEventListener('click', async ()=>{
      const res=await eventAddAttendee(drawerEventId, person.id);
      if(res==='full') toast('Attendee limit reached for this event','err');
      else logActivity('team', `Assigned ${person.name} to the team`, drawerEventId);
      renderDrawer(); renderEventRows();
    });
  }
  const rm=chip.querySelector('[data-rm]');
  if(rm) rm.addEventListener('click', async (e2)=>{
    e2.stopPropagation();
    await eventRemoveAttendee(drawerEventId, person.id);
    renderDrawer(); renderEventRows();
  });
  return chip;
}

function renderTabCollateral(body,e){
  const canManage=can('assign_collateral');
  body.innerHTML=`

    <div class="dropzone" id="packedzone"></div>

  `;
  const packedZone=document.getElementById('packedzone');
  const libZone=document.getElementById('libzone');
  const packedEntries = e.collateral||[];
  packedEntries.forEach(entry=>{
    const {itemId,locId}=decodeCollateralEntry(entry);
    const item=COLLATERAL_LIB.find(c=>c.id===itemId)||{id:itemId,name:itemId,icon:'📦'};
    packedZone.appendChild(makeCollateralChip(item, locId, canManage, true));
  });
  if(packedEntries.length===0) packedZone.innerHTML='<div style="color:var(--text-faint);font-size:11.5px;">Nothing packed yet.</div>';
  COLLATERAL_LIB.forEach(c=>{
    const locs=getStockLocations(c);
    if(locs.length===0){ libZone.appendChild(makeCollateralChip(c, null, canManage, false)); return; }
    locs.forEach(l=>libZone.appendChild(makeCollateralChip(c, l.id, canManage, false)));
  });
  if(canManage){
    packedZone.addEventListener('dragover',ev=>{ev.preventDefault(); packedZone.classList.add('over');});
    packedZone.addEventListener('dragleave',()=>packedZone.classList.remove('over'));
    packedZone.addEventListener('drop', async ev=>{
      ev.preventDefault(); packedZone.classList.remove('over');
      const key=ev.dataTransfer.getData('text/plain'); if(!key) return;
      const cur=getEv().collateral||[]; if(cur.includes(key)) return;
      const {itemId,locId}=decodeCollateralEntry(key);
      const item=COLLATERAL_LIB.find(c=>c.id===itemId);
      if(item){ const {hasLimit,available}=collateralAvailability(item, locId); if(hasLimit && available<=0){ toast(`No more ${item.name} available at that location (0 left)`,'err'); packedZone.classList.add('blocked'); setTimeout(()=>packedZone.classList.remove('blocked'),500); return; } }
      await eventAddCollateral(drawerEventId,key); renderDrawer(); renderEventRows();
    });
    libZone.addEventListener('dragover',ev=>ev.preventDefault());
    libZone.addEventListener('drop', async ev=>{
      ev.preventDefault();
      const key=ev.dataTransfer.getData('text/plain');
      const cur=getEv().collateral||[];
      if(cur.includes(key)){ await eventRemoveCollateral(drawerEventId,key); renderDrawer(); renderEventRows(); }
    });
  }
}
function makeCollateralChip(item, locId, draggable, removable){
  const key=encodeCollateralEntry(item.id, locId);
  const locs=getStockLocations(item);
  const loc=locId!=null?locs.find(l=>l.id===locId):null;
  const chip=document.createElement('div'); chip.className='collateral-item'+(item.required?' req':'');
  chip.draggable=!!draggable;
  const {hasLimit,available}=collateralAvailability(item, locId);
  const availTxt = !removable && hasLimit ? ` <span style="font-size:9.5px;color:${available<=0?'var(--rose)':'var(--text-faint)'};">(${available} left)</span>` : '';
  const locTxt = loc && loc.location ? ` <span style="font-size:9.5px;color:var(--text-faint);">· ${esc(loc.location)}</span>` : '';
  chip.innerHTML=`${item.icon||'📦'} ${esc(item.name)}${locTxt}${availTxt} ${item.required?'<span class="tag">REQUIRED</span>':''}${removable&&draggable?'<span class="x" data-rm="'+esc(key)+'">✕</span>':''}`;
  const titleBits=[item.description, loc&&loc.location?`Stored at: ${loc.location}`:''].filter(Boolean);
  if(titleBits.length) chip.title=titleBits.join(' — ');
  if(draggable) chip.addEventListener('dragstart',ev=>ev.dataTransfer.setData('text/plain', key));
  if(draggable && !removable){
    chip.style.cursor='pointer'; chip.title=(chip.title?chip.title+' — ':'')+'Tap to pack for this event';
    chip.addEventListener('click', async ()=>{
      if((getEv().collateral||[]).includes(key)) return;
      if(hasLimit && available<=0){ toast(`No more ${item.name} available at that location (0 left)`,'err'); return; }
      await eventAddCollateral(drawerEventId,key);
      logActivity('resource', `Packed ${item.name}`, drawerEventId);
      renderDrawer(); renderEventRows();
    });
  }
  const rm=chip.querySelector('[data-rm]');
  if(rm) rm.addEventListener('click', async (e2)=>{
    e2.stopPropagation();
    await eventRemoveCollateral(drawerEventId,key);
    renderDrawer(); renderEventRows();
  });
  return chip;
}

/* ============================================================
   TRAVEL — each traveler confirms their own hotel/flight and checks in on arrival
   ============================================================ */
function getTravel(e, pid){ return (e.travel && e.travel[pid]) || {}; }
async function saveTravelField(eventId, pid, patch){
  if(!EVENTS.find(x=>x.id===eventId)) return;
  await mutateEvent(eventId, ev=>{ const cur=Object.assign({}, ev.travel||{}); cur[pid]=Object.assign({}, cur[pid]||{}, patch); return {travel:cur}; });
  const person=ROSTER.find(r=>r.id===pid);
  const who=person?person.name:'A traveler';
  let what=Object.keys(patch)[0];
  if('hotelConfirmed' in patch) what=`${who} marked hotel ${patch.hotelConfirmed?'booked':'unbooked'}`;
  else if('flightConfirmed' in patch) what=`${who} marked flight ${patch.flightConfirmed?'booked':'unbooked'}`;
  else if('checkedIn' in patch) what=`${who} ${patch.checkedIn?'checked in':'undid check-in'}`;
  logActivity('travel', what, eventId);
}
/* Summary across everyone assigned to an event — used on Project Map / My Conferences cards */
function travelSummary(e){
  const assigned=e.attendees||[];
  let hotel=0, flight=0, checkedIn=0;
  assigned.forEach(pid=>{
    const t=getTravel(e,pid);
    if(t.hotelConfirmed) hotel++;
    if(t.flightConfirmed) flight++;
    if(t.checkedIn) checkedIn++;
  });
  return {total:assigned.length, hotel, flight, checkedIn};
}

/* ============================================================
   WORD (.docx) REPORTS — built in the browser, no library needed.
   A .docx is a zip of XML parts; we write the parts and a minimal
   "stored" (uncompressed) zip ourselves, which Word opens normally.
   ============================================================ */
const CRC_TABLE=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();
function crc32(bytes){ let c=0xFFFFFFFF; for(let i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
  const u16=(v)=>[v&0xFF,(v>>>8)&0xFF], u32=(v)=>[v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF];
  files.forEach(f=>{
    const name=enc.encode(f.name);
    const data=(typeof f.data==='string') ? enc.encode(f.data) : f.data;
    const crc=crc32(data);
    const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(local,name,data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]), name);
    offset += local.length + name.length + data.length;
  });
  const centralSize=central.reduce((n,a)=>n+a.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(centralSize),...u32(offset),...u16(0)]);
  const all=[...parts,...central,end], out=new Uint8Array(all.reduce((n,a)=>n+a.length,0));
  let p=0; all.forEach(a=>{ out.set(a,p); p+=a.length; });
  return out;
}
function xmlEsc(s){ return String(s==null?'':s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,''); }
