/* Fetch an uploaded photo and re-encode it as a JPEG (Word-safe, and keeps the file small) */
async function photoForDocx(id){
  const res=await fetch(blobUrl(id)); if(!res.ok) throw new Error('photo '+res.status);
  const bmp=await createImageBitmap(await res.blob());
  const k=Math.min(1, 1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(bmp.width*k)); c.height=Math.max(1,Math.round(bmp.height*k));
  const cx=c.getContext('2d'); cx.fillStyle='#ffffff'; cx.fillRect(0,0,c.width,c.height); cx.drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
  return {bytes:new Uint8Array(await blob.arrayBuffer()), width:c.width, height:c.height};
}
async function saveBinary(filename, bytes, mime){
  try{ await claudeDownloads.save({filename, data:new Blob([bytes],{type:mime})}); }
  catch(err){ if(err && err.code==='declined') throw err; await claudeDownloads.save({filename, data:bytes}); }
}
async function downloadFeedbackReport(ev, f){
  if(!claudeDownloads){ toast('Downloads aren’t available in this view','err'); return; }
  toast('Preparing Word report…');
  const photos=[]; let skipped=0;
  for(const id of (f.photoIds||[])){ try{ photos.push(await photoForDocx(id)); }catch(e){ skipped++; } }
  const fname=(ev.name||'event').replace(/[^a-z0-9]+/gi,'_').slice(0,60)+'_report.docx';
  try{
    const bytes=makeZip(buildFeedbackDocxFiles(ev, f, photos));
    await saveBinary(fname, bytes, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
    toast(skipped?`Word report downloaded — ${skipped} photo${skipped===1?'':'s'} couldn’t be included`:'Word report downloaded','ok');
  }catch(err){
    if(err && err.code==='declined') return;
    console.warn('docx export failed', err);
    downloadFeedbackReportHtml(ev, f);
  }
}

function buildResourceDropRow(e, canManage, isPeople, onChange){
  const row=document.createElement('div'); row.className='droprow';
  const countLabel = isPeople
    ? `${(e.attendees||[]).length}/${e.maxAttendees||6}`
    : `${(e.collateral||[]).length} item${(e.collateral||[]).length===1?'':'s'}`;
  row.innerHTML=`
    <div class="dr-date"><div class="mo">${e.start?monthAbbr(e.start):'—'}</div><div class="da">${e.start?dayNum(e.start):''}</div></div>
    <div class="dr-info" style="cursor:pointer;">
      <div class="nm">${esc(e.name)}</div>
      <div class="lc">${esc(e.location||e.country||'')} · ${countLabel}</div>
    </div>
    <div class="dr-chips" id="resrow-${e.id}"></div>
  `;
  row.querySelector('.dr-info').addEventListener('click',()=>openEventDrawer(e.id));
  const chipwrap=row.querySelector('.dr-chips');
  if(isPeople){
    (e.attendees||[]).forEach(pid=>{
      const person=ROSTER.find(r=>r.id===pid)||{id:pid,name:profileName(pid)};
      const mc=document.createElement('span'); mc.className='minichip';
      mc.innerHTML=`<span class="avatar" style="width:15px;height:15px;font-size:8px;background:${colorFor(pid)}">${initialsFor(person.name)}</span>${esc(person.name)}${canManage?'<span class="x" data-rm="'+pid+'">✕</span>':''}`;
      chipwrap.appendChild(mc);
    });
    if((e.attendees||[]).length===0) chipwrap.innerHTML='<span class="dr-empty">Nobody assigned yet — drop a teammate here</span>';
  } else {
    (e.collateral||[]).forEach(entry=>{
      const {itemId,locId}=decodeCollateralEntry(entry);
      const item=COLLATERAL_LIB.find(c=>c.id===itemId)||{id:itemId,name:itemId,icon:'📦'};
      const locs=getStockLocations(item);
      const loc=locId!=null?locs.find(l=>l.id===locId):null;
      const mc=document.createElement('span'); mc.className='minichip collat';
      mc.innerHTML=`${item.icon||'📦'} ${esc(item.name)}${loc&&loc.location?' <span style="color:var(--text-faint);">· '+esc(loc.location)+'</span>':''}${canManage?'<span class="x" data-rm="'+esc(entry)+'">✕</span>':''}`;
      chipwrap.appendChild(mc);
    });
    if((e.collateral||[]).length===0) chipwrap.innerHTML='<span class="dr-empty">Nothing packed yet — drop an item here</span>';
  }
  if(canManage){
    const doAssign=async (id)=>{
      if(isPeople){
        if((e.attendees||[]).includes(id)){ clearPick(); return; }
        const res=await eventAddAttendee(e.id,id);
        if(res==='full'){ const max=e.maxAttendees||6; toast(`${e.name} is at its ${max}-person limit`,'err'); row.classList.add('blocked'); setTimeout(()=>row.classList.remove('blocked'),500); return; }
        const person=ROSTER.find(r=>r.id===id);
        logActivity('team', `Assigned ${person?person.name:'someone'} to the team`, e.id);
        toast(`Assigned to ${e.name}`,'ok');
      } else {
        if((e.collateral||[]).includes(id)){ clearPick(); return; }
        const {itemId,locId}=decodeCollateralEntry(id);
        const item=COLLATERAL_LIB.find(c=>c.id===itemId);
        if(item){ const {hasLimit,available}=collateralAvailability(item, locId); if(hasLimit && available<=0){ toast(`No more ${item.name} available at that location (0 left)`,'err'); row.classList.add('blocked'); setTimeout(()=>row.classList.remove('blocked'),500); return; } }
        await eventAddCollateral(e.id,id);
        logActivity('resource', `Packed ${item?item.name:'an item'}`, e.id);
        toast(`Packed for ${e.name}`,'ok');
      }
      clearPick(); onChange();
    };
    row.addEventListener('dragover',ev=>{ ev.preventDefault(); row.classList.add('over'); });
    row.addEventListener('dragleave',()=>row.classList.remove('over'));
    row.addEventListener('drop', ev=>{
      ev.preventDefault(); row.classList.remove('over');
      const id=ev.dataTransfer.getData('text/plain'); if(id) doAssign(id);
    });
    row.addEventListener('click', ev=>{
      if(ev.target.closest('.dr-info') || ev.target.closest('[data-rm]')) return;
      const id=currentPick(isPeople?'person':'asset'); if(id) doAssign(id);
    });
    chipwrap.querySelectorAll('[data-rm]').forEach(x=>x.addEventListener('click', async ev2=>{
      ev2.stopPropagation();
      const id=x.dataset.rm;
      if(isPeople) await eventRemoveAttendee(e.id,id); else await eventRemoveCollateral(e.id,id);
      onChange();
    }));
  }
  return row;
}

let staffCanvas, staffCtx, staffPins=[];
function staffZoomBtn(factor){
  if(!staffCanvas) return;

function initStaffCanvas(){
  staffCanvas=document.getElementById('staffcanvas');
  if(!staffCanvas) return;
  const dpr=window.devicePixelRatio||1;
  const rect=staffCanvas.getBoundingClientRect();
  staffCanvas.width=rect.width*dpr; staffCanvas.height=300*dpr;
  staffCtx=staffCanvas.getContext('2d'); staffCtx.scale(dpr,dpr);
  staffCanvas._w=rect.width; staffCanvas._h=300;
  drawStaffMap();
  staffCanvas.onclick=(ev)=>{
    const rect2=staffCanvas.getBoundingClientRect();
    const mx=ev.clientX-rect2.left, my=ev.clientY-rect2.top;
    let best=null, bestD=18;
    staffPins.forEach(p=>{ const d=Math.hypot(p.x-mx,p.y-my); if(d<bestD){bestD=d; best=p;} });
    if(best){
      const rowEl=document.getElementById('resrow-'+best.id);
      if(rowEl){ rowEl.closest('.droprow').scrollIntoView({behavior:'smooth', block:'center'}); rowEl.closest('.droprow').style.borderColor='var(--cyan)'; setTimeout(()=>{ rowEl.closest('.droprow').style.borderColor=''; },900); }
    }
  };
  wireMapZoomPan(staffCanvas, staffView, drawStaffMap);
}
function drawFlightLine(ctx,x0,y0,x1,y1,color){
  const dx=x1-x0, dy=y1-y0;
  const dist=Math.hypot(dx,dy)||1;
  const curve=Math.min(50, dist*0.16);
  const mx=(x0+x1)/2, my=(y0+y1)/2;
  const cx=mx - (dy/dist)*curve, cy=my + (dx/dist)*curve;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.quadraticCurveTo(cx,cy,x1,y1);
  ctx.setLineDash([4,3]); ctx.lineWidth=1.1; ctx.strokeStyle=color; ctx.globalAlpha=.5; ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.arc(x0,y0,2.2,0,7); ctx.fillStyle=color; ctx.globalAlpha=.85; ctx.fill(); ctx.globalAlpha=1;
}
function drawStaffMap(){
  if(!staffCtx) return;
  const W=staffCanvas._w, H=staffCanvas._h;
  const isPeople = resourceMode==='people';
  staffCtx.clearRect(0,0,W,H);
  staffPins=[];
  drawLandFlat(staffCtx,W,H,staffView);
  const pinRing=tok('--pin-ring'), pinEmpty=tok('--pin-empty');
  drawCityLabels(staffCtx,W,H,staffView);
  if(isPeople && showFlightLines){
    staffVisibleEvents.forEach(e=>{
      const destGeo=geocode(e); if(!destGeo) return;
      const [dlat,dlon]=destGeo;
      const [dx,dy]=projFlat(dlon,dlat,W,H,staffView);
      (e.attendees||[]).forEach(pid=>{
        const person=ROSTER.find(r=>r.id===pid);
        if(!person || !person.homeLocation) return;
        const homeGeo=geocodeHome(person.homeLocation); if(!homeGeo) return;
        const [hlat,hlon]=homeGeo;
        const [hx,hy]=projFlat(hlon,hlat,W,H,staffView);
        drawFlightLine(staffCtx,hx,hy,dx,dy,pinColor(e));
      });
    });
  }
  EVENTS.forEach(e=>{
    const geo=geocode(e); if(!geo) return;
    const n = isPeople ? (e.attendees||[]).length : (e.collateral||[]).length;
    const [lat,lon]=geo;
    const [x,y]=projFlat(lon,lat,W,H,staffView);
    const r = n>0 ? 4.5+Math.min(6,n*1.3) : 2.6;
    staffCtx.beginPath(); staffCtx.arc(x,y,r,0,7);
    staffCtx.fillStyle = n>0 ? pinColor(e) : pinEmpty;
    staffCtx.globalAlpha = n>0 ? .92 : .6; staffCtx.fill(); staffCtx.globalAlpha=1;
    staffCtx.lineWidth=1.2; staffCtx.strokeStyle=pinRing; staffCtx.stroke();
    if(n>0){ staffCtx.fillStyle='#ffffff'; staffCtx.font='bold 9px Inter'; staffCtx.textAlign='center'; staffCtx.textBaseline='middle'; staffCtx.fillText(String(n), x, y+0.5); }
    staffPins.push({x,y,id:e.id});
  });
}

/* Proper CSV cell splitting: keeps blank cells in place and handles "quoted, values" and "" escapes */
function splitCsvLine(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ out.push(cur); cur=''; }
    else cur+=ch;
  }
  out.push(cur);
  return out;
}
function parseRosterCSV(text){
  const lines = String(text||'').split(/\r\n|\r|\n/).map(l=>l.trim()).filter(l=>l.length>0);
  const rows=[]; const errors=[];
  lines.forEach((line, i)=>{
    // basic CSV split respecting simple quoted fields (so "City, ST" survives as one cell)
    const clean = splitCsvLine(line).map(c=>c.trim());
    const [name, title, email, homeLocation] = clean;
    if(i===0 && name && name.toLowerCase()==='name'){ return; } // skip header row
    if(!name){ errors.push({line:i+1, msg:'Missing name'}); return; }
    if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ errors.push({line:i+1, msg:`"${name}" has an invalid email (${email})`}); return; }
    rows.push({name, title: title||'', email: email||'', homeLocation: homeLocation||''});
  });
  return {rows, errors};
}

    </div>

      <button class="btn ghost" id="bi_cancel">Cancel</button>
      <button class="btn primary" id="bi_import" disabled>Import</button>
    </div>
  `;
  let parsedRows=[];
  document.getElementById('bi_template').addEventListener('click', downloadRosterTemplate);
  document.getElementById('bi_cancel').addEventListener('click', ()=>{ document.querySelector('.modal').classList.remove('wide'); closeModal(); });
  const fileInput=document.getElementById('bi_file');
  fileInput.addEventListener('change', ()=>{
    const f=fileInput.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>{ document.getElementById('bi_paste').value = String(reader.result||''); runPreview(); };
    reader.readAsText(f);
  });
  function runPreview(){
    const raw=document.getElementById('bi_paste').value;
    const {rows, errors}=parseRosterCSV(raw);
    parsedRows=rows;
    const results=document.getElementById('bi_results');
    const importBtn=document.getElementById('bi_import');
    if(rows.length===0 && errors.length===0){
      results.innerHTML='<div style="color:var(--text-faint);font-size:12px;">Nothing to preview yet — add some rows above.</div>';
      importBtn.disabled=true; return;
    }
    const existingNames=new Set(ROSTER.map(r=>r.name.toLowerCase()));
    let dupeCount=0;
    const tableRows = rows.map(r=>{
      const dupe = existingNames.has(r.name.toLowerCase());
      if(dupe) dupeCount++;
      return `<tr><td>${esc(r.name)}</td><td>${esc(r.title)}</td><td>${esc(r.email)}</td><td>${esc(r.homeLocation)}</td><td>${dupe?'<span style="color:var(--amber);">already in roster</span>':'<span style="color:var(--cyan);">new</span>'}</td></tr>`;
    }).join('') + errors.map(e=>`<tr class="rowerr"><td colspan="5">Line ${e.line}: ${esc(e.msg)}</td></tr>`).join('');
    results.innerHTML = `
      <div class="importsummary"><span><b>${rows.length}</b> ready to import</span>${dupeCount?`<span><b>${dupeCount}</b> look like duplicates</span>`:''}${errors.length?`<span style="color:var(--rose);"><b>${errors.length}</b> row${errors.length===1?'':'s'} skipped</span>`:''}</div>
      <div class="importscroll"><table class="importtable"><thead><tr><th>Name</th><th>Title</th><th>Email</th><th>Home location</th><th>Status</th></tr></thead><tbody>${tableRows}</tbody></table></div>
    `;
    importBtn.disabled = rows.length===0;
  }
  document.getElementById('bi_preview').addEventListener('click', runPreview);
  document.getElementById('bi_import').addEventListener('click', async ()=>{
    if(parsedRows.length===0) return;
    const importBtn=document.getElementById('bi_import');
    importBtn.disabled=true; importBtn.textContent='Importing…';
    let added=0;
    for(const r of parsedRows){
      const id=uid('p');
      const doc={name:r.name, title:r.title, email:r.email, homeLocation:r.homeLocation};
      ROSTER.push(Object.assign({id},doc));
      if(claudeDb){ try{ await claudeDb.collection('roster').doc(id).set(doc); }catch(e){} }
      added++;
    }
    document.querySelector('.modal').classList.remove('wide');
    closeModal();
    renderRoster();
    logActivity('roster', `Imported ${added} ${added===1?'person':'people'} into the roster`, null);
    toast(`Imported ${added} ${added===1?'person':'people'} into the roster`,'ok');
  });
}

function openCollateralItemModal(existing){
  const isEdit=!!existing;
  const body=document.getElementById('modalbody');
  document.getElementById('modalbg').classList.add('open');
  document.querySelector('.modal').classList.add('wide');
  let rows = isEdit ? getStockLocations(existing).map(l=>({id:l.id, location:l.location||'', quantity:l.quantity!=null?String(l.quantity):''}))
                    : [{id:uid('loc'), location:'', quantity:''}];
  body.innerHTML=`<h3>${isEdit?'Edit collateral item':'Add collateral item'}</h3>
    <div class="row2">
      <div class="field"><label>Icon (emoji)</label><input id="ci_icon" placeholder="🎪" maxlength="2" value="${isEdit?esc(existing.icon||''):''}"></div>
      <div class="field"><label>Name</label><input id="ci_name" placeholder="Pop-up banner" value="${isEdit?esc(existing.name||''):''}"></div>
    </div>
    <div class="field"><label>Description</label><textarea id="ci_desc" placeholder="10x10 pop-up banner with company logo, fits in a 6ft case">${isEdit?esc(existing.description||''):''}</textarea></div>
    <div class="field"><label><input type="checkbox" id="ci_req" style="width:auto;margin-right:6px;" ${isEdit&&existing.required?'checked':''}>Required for every event</label></div>
    <div class="subhead" style="margin-top:6px;">Stock locations</div>
    <div style="font-size:11.5px;color:var(--text-faint);margin:-4px 0 10px;">Where copies of this item are physically stored, and how many at each. Leave a quantity blank for no limit at that location.</div>
    <div id="ci_locrows"></div>
    <button class="btn ghost sm" id="ci_addloc" type="button">+ Add another location</button>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:18px;">
      <button class="btn ghost" id="ci_cancel">Cancel</button><button class="btn primary" id="ci_save">${isEdit?'Save changes':'Add'}</button>
    </div>`;
  function renderLocRows(){
    const wrap=document.getElementById('ci_locrows');
    wrap.innerHTML = rows.map((r,i)=>`
      <div class="row2" data-locrow="${r.id}" style="grid-template-columns:2fr 1fr auto;align-items:end;margin-bottom:8px;">
        <div class="field" style="margin-bottom:0;"><label>${i===0?'Location':''}</label><input class="ci_loc_name" data-i="${i}" placeholder="Austin warehouse" value="${esc(r.location)}"></div>
        <div class="field" style="margin-bottom:0;"><label>${i===0?'Quantity':''}</label><input class="ci_loc_qty" data-i="${i}" type="number" min="0" placeholder="no limit" value="${esc(r.quantity)}"></div>
        <button class="iconbtn" data-rmloc="${i}" title="Remove location" ${rows.length<=1?'style="visibility:hidden;"':''}>✕</button>
      </div>`).join('');
    wrap.querySelectorAll('.ci_loc_name').forEach(inp=>inp.addEventListener('input',e=>{ rows[Number(e.target.dataset.i)].location=e.target.value; }));
    wrap.querySelectorAll('.ci_loc_qty').forEach(inp=>inp.addEventListener('input',e=>{ rows[Number(e.target.dataset.i)].quantity=e.target.value; }));
    wrap.querySelectorAll('[data-rmloc]').forEach(btn=>btn.addEventListener('click',()=>{
      if(rows.length<=1) return;
      rows.splice(Number(btn.dataset.rmloc),1);
      renderLocRows();
    }));
  }
  renderLocRows();
  document.getElementById('ci_addloc').addEventListener('click', ()=>{ rows.push({id:uid('loc'), location:'', quantity:''}); renderLocRows(); });
  document.getElementById('ci_cancel').onclick=()=>{ document.querySelector('.modal').classList.remove('wide'); closeModal(); };
  document.getElementById('ci_save').onclick=async ()=>{
    const name=document.getElementById('ci_name').value.trim(); if(!name){toast('Name required','err');return;}
    const stockLocations = rows
      .filter(r=>r.location.trim()!=='' || r.quantity.trim()!=='')
      .map(r=>({id:r.id, location:r.location.trim(), quantity: r.quantity.trim()===''? null : Math.max(0, Number(r.quantity)||0)}));
    const doc={
      name, icon:document.getElementById('ci_icon').value.trim()||'📦',
      required:document.getElementById('ci_req').checked,
      description:document.getElementById('ci_desc').value.trim(),
      stockLocations, quantity:null, location:'', // clear legacy single fields now that stockLocations is the source of truth
    };
    document.querySelector('.modal').classList.remove('wide');
    if(isEdit){
      const idx=COLLATERAL_LIB.findIndex(x=>x.id===existing.id);
      if(idx>=0) COLLATERAL_LIB[idx]=Object.assign({}, COLLATERAL_LIB[idx], doc);
      closeModal(); renderCollateralLib();
      if(claudeDb){ try{ await claudeDb.collection('collateralLibrary').doc(existing.id).update(doc); }catch(e){} }
      toast('Updated '+name,'ok');
    } else {
      const id=uid('col'); COLLATERAL_LIB.push(Object.assign({id},doc));
      closeModal(); renderCollateralLib();
      if(claudeDb){ try{ await claudeDb.collection('collateralLibrary').doc(id).set(doc); }catch(e){} }
      logActivity('collateral', `Added ${name} to the collateral library`, null);
    }
  };
}

    row.querySelector('[data-relink]').onclick=async ()=>{
      try{ const r=await claudeUser.accounts.invite(inv.email, inv.name, inv.role); await loadAccounts(); renderPermissions(true);
        if(claudeUser.accounts.emailsInvites) showLinkModal('Invite sent again', `We\u2019ve emailed a fresh invite to <b>${esc(inv.email)}</b>. It expires on ${esc(fmtWhen(r.expiresAt))}.`, r.link, 'You can also send them this link yourself.');
        else showLinkModal('New invite link', `The old link for <b>${esc(inv.email)}</b> no longer works. This one expires on ${esc(fmtWhen(r.expiresAt))}.`, r.link); }
      catch(e){ toast(e.message||'Couldn\u2019t create a new link','err'); }
    };
    row.querySelector('[data-revoke]').onclick=async ()=>{
      if(!(await askConfirm(`Revoke the invite for ${inv.email}? The link they were sent will stop working.`,'Revoke invite'))) return;
      try{ await claudeUser.accounts.revokeInvite(inv.id); logActivity('role', `Revoked the invite for ${inv.email}`, null); await loadAccounts(); renderPermissions(true); toast('Invite revoked','ok'); }
      catch(e){ toast(e.message||'Couldn\u2019t revoke the invite','err'); }
    };
    invList.appendChild(row);
  });
  const ids=[...new Set([...(ACCOUNTS?ACCOUNTS.users.map(u=>u.id):[]), ...Object.keys(MEMBERS), ...Object.keys(ROLES)])];
  const entries=ids.map(id=>Object.assign({id, role:'attendee'}, acctUsers[id]?{name:acctUsers[id].name}:{}, MEMBERS[id]?{name:MEMBERS[id].name}:{}, ROLES[id]||{}, acctUsers[id]&&acctUsers[id].isOwner?{role:'admin'}:{}));
  if(hasAccounts() && !fromRefresh){ loadAccounts().then(ok=>{ if(ok && currentView==='permissions') renderPermissions(true); }); }
  if(entries.length===0){ list.innerHTML='<div class="empty-state">No one else has opened this yet.</div>'; return; }
  entries.forEach(r=>{
    const row=document.createElement('div'); row.className='rolerow';
    const nm = PROFILE_CACHE[r.id]?.name || (MEMBERS[r.id]&&MEMBERS[r.id].name) || r.name || 'Teammate';
    const isMe = r.id===ME_ID;
    const acc = acctUsers[r.id];
    const locked = !CAN_WRITE_ROLES || (isMe && IS_OWNER) || !!(acc && acc.isOwner);
    const status = acc ? `${esc(acc.email)} · ${acc.disabled?'<span class="off">Turned off</span>':(acc.lastLoginAt?'last signed in '+esc(fmtWhen(acc.lastLoginAt)):'never signed in')}${acc.isOwner?' · owner':''}` : '';
    row.innerHTML=`<div style="display:flex;align-items:center;gap:10px;min-width:0;"><div class="avatar" style="width:30px;height:30px;font-size:11px;background:${colorFor(r.id)}">${initialsFor(nm)}</div><div style="min-width:0;"><div>${esc(nm)}${isMe?' <span style="color:var(--text-faint);font-size:11px;">(you)</span>':''}</div>${status?`<div class="acctstatus" style="overflow-wrap:anywhere;">${status}</div>`:''}</div></div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
        ${!isMe?`<button class="btn ghost sm" data-viewas="${r.id}" data-nm="${esc(nm)}" data-role="${r.role||'attendee'}">👁 View as</button>`:''}
        ${(acc && hasAccounts())?`<button class="btn ghost sm" data-resetpw title="Send them a link to set a new password">Reset password</button>`:''}
        ${(acc && hasAccounts() && !isMe && !acc.isOwner)?`<button class="btn ${acc.disabled?'ghost':'danger'} sm" data-toggleacct>${acc.disabled?'Turn on':'Turn off'}</button>`:''}
        <div class="rolebtns">
          <button data-role="attendee" class="${r.role==='attendee'?'sel':''}" ${locked?'disabled':''}>Attendee</button>
          <button data-role="manager" class="${r.role==='manager'?'sel':''}" ${locked?'disabled':''}>Manager</button>
          <button data-role="admin" class="${r.role==='admin'?'sel':''}" ${locked?'disabled':''}>Admin</button>
        </div>
      </div>`;
    row.querySelectorAll('.rolebtns [data-role]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(locked) return;
        const role=btn.dataset.role;
        if(role===r.role) return;
        const prev=ROLES[r.id];
        ROLES[r.id]={...stripId(prev), id:r.id, role, name:nm}; renderPermissions();
        if(claudeDb){
          try{ await claudeDb.collection('roles').doc(r.id).set(Object.assign(stripId(prev), {role, name:nm, changedAt:Date.now(), changedBy:ME_ID})); }
          catch(e){
            if(prev) ROLES[r.id]=prev; else delete ROLES[r.id];
            renderPermissions();
            toast('That role change wasn\u2019t saved. Only the owner and people with Edit access can change roles.','err');
            return;
          }
        }
        if(r.id===ME_ID){ MY_ROLE=role; ACTUAL_ROLE=role; renderShell(); }
        logActivity('role', `Set ${nm}'s role to ${role}`, null);
      });
    });
    const resetPw=row.querySelector('[data-resetpw]');
    if(resetPw) resetPw.addEventListener('click', async ()=>{
      try{
        const r2=await claudeUser.accounts.resetLink(r.id);
        if(r2 && r2.emailed){ logActivity('role', `Sent ${nm} a password reset email`, null); toast(`Password reset email sent to ${acc.email}`,'ok'); return; }
        logActivity('role', `Created a password reset link for ${nm}`, null);
        showLinkModal('Password reset link', `Send this link to <b>${esc(nm)}</b> (${esc(acc.email)}). It works once and expires ${esc(new Date(r2.expiresAt).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}. Their current password keeps working until they use it.`, r2.link);
      }catch(e){ toast(e.message||'Couldn\u2019t create a reset link','err'); }
    });
    const toggleAcct=row.querySelector('[data-toggleacct]');
    if(toggleAcct) toggleAcct.addEventListener('click', async ()=>{
      const turnOff=!acc.disabled;
      if(turnOff && !(await askConfirm(`Turn off ${nm}'s account? They'll be signed out everywhere and can't sign in until you turn it back on. Their events and reports stay.`,'Turn off account'))) return;
      try{ await claudeUser.accounts.setDisabled(r.id, turnOff); logActivity('role', `${turnOff?'Turned off':'Turned on'} ${nm}'s account`, null); await loadAccounts(); renderPermissions(true); toast(turnOff?'Account turned off':'Account turned on','ok'); }
      catch(e){ toast(e.message||'Couldn\u2019t change the account','err'); }
    });
    const viewAsBtn=row.querySelector('[data-viewas]');
    if(viewAsBtn) viewAsBtn.addEventListener('click', ()=>startImpersonation(viewAsBtn.dataset.viewas, viewAsBtn.dataset.nm, viewAsBtn.dataset.role));
    list.appendChild(row);
  });
  resolveProfiles(entries.map(r=>r.id)).then(changed=>{ if(changed && currentView==='permissions') renderPermissions(); });
}

/* ============================================================
   GO
   ============================================================ */
window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
